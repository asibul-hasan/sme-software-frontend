name: Build and Deploy Aidly PMS App

on:
  push:
    branches:
      - main
    paths:
      - 'apps/aidlyPms/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/deploy-pms.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  pms-deploy:
    name: Deploy Aidly PMS to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Verify Schema & Database Parity
        run: npm run verify:pms-schema

      - name: Build Aidly PMS project
        env:
          NX_DAEMON: 'false'
        run: npm run build:pms -- --configuration production

      - name: Create .htaccess for SPA routing (cPanel)
        run: |
          cat << 'EOF' > ./dist/apps/aidlyPms/browser/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PMS_FTP_SERVER }}
          username: ${{ secrets.PMS_FTP_USERNAME }}
          password: ${{ secrets.PMS_FTP_PASSWORD }}
          local-dir: ./dist/apps/aidlyPms/browser/
          server-dir: ./

      - name: Clear GitHub Actions caches & artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Purging artifacts and caches to keep GitHub storage under limit..."
          # Delete any stored artifacts for this repository
          gh api -X GET "repos/$REPO/actions/artifacts" --jq '.artifacts[].id' 2>/dev/null | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting artifact ID: $id"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" 2>/dev/null || true
            fi
          done

          # Delete all actions caches for this repository
          gh api -X GET "repos/$REPO/actions/caches" --jq '.actions_caches[].id' 2>/dev/null | while read -r cache_id; do
            if [ -n "$cache_id" ]; then
              echo "Deleting cache ID: $cache_id"
              gh api -X DELETE "repos/$REPO/actions/caches/$cache_id" 2>/dev/null || true
            fi
          done
          echo "Storage cleanup complete."
