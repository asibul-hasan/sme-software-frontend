<div class="dashboard-wrapper p-3 p-lg-4">
  <!-- Dashboard Header with Filter -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <div>
      <h4 class="mb-1 fw-black text-primary">Dashboard Overview</h4>
      <p class="text-muted small mb-0">Welcome back! Here's what's happening with your business today.</p>
    </div>
    <div class="d-flex align-items-center gap-2 bg-card-themed p-2 rounded-4 shadow-sm border">
      <div class="filter-icon ps-2">
        <i class="bi bi-calendar3 text-primary"></i>
      </div>
      <input type="date" class="form-control form-control-sm border-0 bg-transparent fw-bold small" value="2024-05-01">
      <span class="text-muted small px-1">to</span>
      <input type="date" class="form-control form-control-sm border-0 bg-transparent fw-bold small" value="2024-05-31">
      <button class="btn btn-primary btn-sm rounded-3 px-3 ms-2">
        <i class="bi bi-filter me-1"></i> Filter
      </button>
    </div>
  </div>

  <!-- Row 1: Stats -->
  <app-stat-cards></app-stat-cards>

  <!-- Row 2: Sales Overview (8) | Branch Sales (4) -->
  <div class="row g-3 mb-4">
    <div class="col-lg-8">
      <app-sales-overview-chart></app-sales-overview-chart>
    </div>
    <div class="col-lg-4">
      <app-branch-sales-chart></app-branch-sales-chart>
    </div>
  </div>

  <!-- Row 3: Sales vs Purchases (8) | Inventory Snapshot (4) -->
  <div class="row g-3 mb-4">
    <div class="col-lg-8">
      <app-sales-vs-purchases-chart></app-sales-vs-purchases-chart>
    </div>
    <div class="col-lg-4">
      <app-inventory-snapshot></app-inventory-snapshot>
    </div>
  </div>

  <!-- Row 4: Recent Transactions | Purchase Orders | Financial Overview -->
  <div class="row g-3 mb-4">
    <div class="col-lg-4">
      <app-recent-transactions></app-recent-transactions>
    </div>
    <div class="col-lg-4">
      <app-purchase-orders></app-purchase-orders>
    </div>
    <div class="col-lg-4">
      <app-financial-overview></app-financial-overview>
    </div>
  </div>

  <!-- Row 5: Top Products | Tasks & Alerts | Quick Actions -->
  <div class="row g-3 mb-4">
    <div class="col-lg-4">
      <app-top-products></app-top-products>
    </div>
    <div class="col-lg-4">
      <app-alerts-overview></app-alerts-overview>
    </div>
    <div class="col-lg-4">
      <app-quick-actions></app-quick-actions>
    </div>
  </div>

  <!-- Row 6: Detailed Analysis -->
  <div class="row g-3">
    <div class="col-lg-6">
      <app-sales-distribution></app-sales-distribution>
    </div>
    <div class="col-lg-6">
      <app-branch-performance></app-branch-performance>
    </div>
  </div>
</div>
