<div class="p-3 lg:p-4">
  <!-- Dashboard Header with Filter -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-6 gap-3">
    <div>
      <h4 class="mb-1 font-black text-primary text-xl">Dashboard Overview</h4>
      <p class="text-subtle text-sm mb-0">Welcome back! Here's what's happening with your business today.</p>
    </div>
    <div class="flex items-center gap-2 bg-surface p-2 rounded-2xl shadow-sm border border-line">
      <div class="ps-2">
        <i class="bi bi-calendar3 text-primary"></i>
      </div>
      <app-date-picker value="2024-05-01" placeholder="Select date" />
      <span class="text-subtle text-sm px-1">to</span>
      <app-date-picker value="2024-05-31" placeholder="Select date" />
      <button class="bg-primary text-white text-sm font-medium rounded-lg px-3 py-1.5 ms-2 hover:bg-opacity-90 transition-colors">
        <i class="bi bi-filter me-1"></i> Filter
      </button>
    </div>
  </div>

  <!-- Row 1: Stats -->
  <app-stat-cards></app-stat-cards>

  <!-- Row 2: Sales Overview (8) | Branch Sales (4) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">
    <div class="lg:col-span-8">
      <app-sales-overview-chart></app-sales-overview-chart>
    </div>
    <div class="lg:col-span-4">
      <app-branch-sales-chart></app-branch-sales-chart>
    </div>
  </div>

  <!-- Row 3: Sales vs Purchases (8) | Inventory Snapshot (4) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">
    <div class="lg:col-span-8">
      <app-sales-vs-purchases-chart></app-sales-vs-purchases-chart>
    </div>
    <div class="lg:col-span-4">
      <app-inventory-snapshot></app-inventory-snapshot>
    </div>
  </div>

  <!-- Row 4: Recent Transactions | Purchase Orders | Financial Overview -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">
    <div class="lg:col-span-4">
      <app-recent-transactions></app-recent-transactions>
    </div>
    <div class="lg:col-span-4">
      <app-purchase-orders></app-purchase-orders>
    </div>
    <div class="lg:col-span-4">
      <app-financial-overview></app-financial-overview>
    </div>
  </div>

  <!-- Row 5: Top Products | Tasks & Alerts | Quick Actions -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">
    <div class="lg:col-span-4">
      <app-top-products></app-top-products>
    </div>
    <div class="lg:col-span-4">
      <app-alerts-overview></app-alerts-overview>
    </div>
    <div class="lg:col-span-4">
      <app-quick-actions></app-quick-actions>
    </div>
  </div>

  <!-- Row 6: Detailed Analysis -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
    <div class="lg:col-span-6">
      <app-sales-distribution></app-sales-distribution>
    </div>
    <div class="lg:col-span-6">
      <app-branch-performance></app-branch-performance>
    </div>
  </div>
</div>
