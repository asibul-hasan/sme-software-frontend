<div class="row g-3 mb-4">
  <!-- Today's Sales -->
  <div class="col">
    <div class="kpi-card-v1">
      <div class="d-flex align-items-center mb-2">
        <div class="icon-box-v1 bg-success-light text-success me-3">
          <i class="bi bi-bag-fill"></i>
        </div>
        <span class="text-muted small fw-bold">Today's Sales</span>
      </div>
      <div class="amount-v1 fw-black h4 mb-2">৳ 125,750</div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-success xx-small fw-bold">+12.5% vs yesterday</span>
        <div class="spark-v1">
          <canvas id="salesSparkline" width="60" height="20"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Total Revenue -->
  <div class="col">
    <div class="kpi-card-v1">
      <div class="d-flex align-items-center mb-2">
        <div class="icon-box-v1 bg-primary-light text-primary me-3">
          <i class="bi bi-wallet2"></i>
        </div>
        <span class="text-muted small fw-bold">Total Revenue (May)</span>
      </div>
      <div class="amount-v1 fw-black h4 mb-2">৳ 3,245,650</div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-primary xx-small fw-bold">+18.3% vs last month</span>
        <div class="spark-v1">
          <canvas id="revenueSparkline" width="60" height="20"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Expenses -->
  <div class="col">
    <div class="kpi-card-v1">
      <div class="d-flex align-items-center mb-2">
        <div class="icon-box-v1 bg-warning-light text-warning me-3">
          <i class="bi bi-credit-card-fill"></i>
        </div>
        <span class="text-muted small fw-bold">Expenses (May)</span>
      </div>
      <div class="amount-v1 fw-black h4 mb-2">৳ 1,245,320</div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-warning xx-small fw-bold">+8.7% vs last month</span>
        <div class="spark-v1">
          <canvas id="expensesSparkline" width="60" height="20"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Profit / Loss -->
  <div class="col">
    <div class="kpi-card-v1">
      <div class="d-flex align-items-center mb-2">
        <div class="icon-box-v1 bg-info-light text-info me-3">
          <i class="bi bi-graph-up-arrow"></i>
        </div>
        <span class="text-muted small fw-bold">Profit / Loss (May)</span>
      </div>
      <div class="amount-v1 fw-black h4 mb-2">৳ 1,999,330</div>
      <div class="d-flex align-items-center justify-content-between">
        <span class="text-success xx-small fw-bold">+24.6% vs last month</span>
        <div class="spark-v1">
          <canvas id="profitSparkline" width="60" height="20"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Pending Payments -->
  <div class="col">
    <div class="kpi-card-v1">
      <div class="d-flex align-items-center mb-2">
        <div class="icon-box-v1 bg-danger-light text-danger me-3">
          <i class="bi bi-file-earmark-text-fill"></i>
        </div>
        <span class="text-muted small fw-bold">Pending Payments</span>
      </div>
      <div class="amount-v1 fw-black h4 mb-2">৳ 865,300</div>
      <div class="d-flex align-items-center">
        <span class="text-danger xx-small fw-bold">12 Invoices</span>
      </div>
    </div>
  </div>
</div>
