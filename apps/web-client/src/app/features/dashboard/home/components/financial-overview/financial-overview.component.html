<div class="bg-surface rounded-2xl shadow-sm border border-line flex flex-col h-full">
  <div class="p-4 border-b-0">
    <h6 class="mb-0 font-bold text-lg text-content">Financial Overview</h6>
  </div>
  <div class="p-4 pt-0 flex-1">
    <div *ngFor="let item of items" class="flex items-center mb-3 p-3 rounded-2xl hover:bg-muted transition-colors cursor-pointer">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center me-3" [ngClass]="'bg-' + item.color + '/10 text-' + item.color">
        <i class="bi text-lg" [ngClass]="item.icon"></i>
      </div>
      <div class="flex-1">
        <div class="text-sm text-subtle font-bold leading-none mb-1">{{item.label}}</div>
        <div class="text-lg mb-0 font-black text-content">{{item.value}}</div>
      </div>
      <i class="bi bi-chevron-right text-subtle text-sm"></i>
    </div>
  </div>
</div>
