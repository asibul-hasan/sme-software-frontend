<div class="card border-0 shadow-sm h-100">
  <div class="card-header border-0 py-3">
    <h6 class="mb-0 fw-bold">Financial Overview</h6>
  </div>
  <div class="card-body pt-0">
    <div *ngFor="let item of items" class="d-flex align-items-center mb-3 p-3 rounded-4 hover-bg">
      <div class="icon-box-md me-3" [ngClass]="'bg-' + item.color + '-light text-' + item.color">
        <i class="bi" [ngClass]="item.icon"></i>
      </div>
      <div class="flex-grow-1">
        <div class="small text-muted fw-bold lh-1 mb-1">{{item.label}}</div>
        <div class="h6 mb-0 fw-black">{{item.value}}</div>
      </div>
      <i class="bi bi-chevron-right text-muted small"></i>
    </div>
  </div>
</div>
