<div class="card border-0 shadow-sm h-100">
  <div class="card-header border-0 py-3 d-flex justify-content-between align-items-center">
    <h6 class="mb-0 fw-bold">Top Selling Products</h6>
    <select class="form-select form-select-sm w-auto border-0 bg-light-2d xx-small fw-bold">
      <option>This Month</option>
    </select>
  </div>
  <div class="card-body">
    <div *ngFor="let product of products" class="mb-3">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="small text-muted fw-bold">{{product.name}}</span>
        <span class="small fw-black">৳ {{product.amount}}</span>
      </div>
      <div class="progress" style="height: 6px;">
        <div class="progress-bar bg-primary" role="progressbar" [style.width.%]="product.percentage"></div>
      </div>
    </div>
  </div>
</div>
