<div class="card border-0 shadow-sm h-100 overflow-hidden">
  <div class="card-header border-0 py-3 d-flex justify-content-between align-items-center bg-transparent">
    <h6 class="mb-0 fw-bold">Recent Transactions</h6>
    <div class="tab-group bg-light-2d p-1 rounded-3">
      <button class="tab-btn px-3 py-1 rounded-2 small fw-bold" [class.active]="activeTab === 'sales'" (click)="activeTab = 'sales'">Sales</button>
      <button class="tab-btn px-3 py-1 rounded-2 small fw-bold" [class.active]="activeTab === 'purchases'" (click)="activeTab = 'purchases'">Purchases</button>
    </div>
  </div>
  
  <div class="card-body p-0">
    <div class="transaction-list px-3 pb-3">
      <!-- Sales List -->
      <div *ngIf="activeTab === 'sales'">
        <div *ngFor="let item of sales" class="transaction-item d-flex justify-content-between align-items-center py-3 border-bottom-themed">
          <div>
            <div class="fw-bold small mb-0">{{item.id}}</div>
            <div class="xx-small text-muted">{{item.entity}}</div>
          </div>
          <div class="text-end">
            <div class="fw-black text-success small">+ ৳ {{item.amount}}</div>
            <div class="xx-small text-muted">{{item.date}}, 12:30</div>
          </div>
        </div>
      </div>

      <!-- Purchases List -->
      <div *ngIf="activeTab === 'purchases'">
        <div *ngFor="let item of purchases" class="transaction-item d-flex justify-content-between align-items-center py-3 border-bottom-themed">
          <div>
            <div class="fw-bold small mb-0">{{item.id}}</div>
            <div class="xx-small text-muted">{{item.entity}}</div>
          </div>
          <div class="text-end">
            <div class="fw-black text-danger small">- ৳ {{item.amount}}</div>
            <div class="xx-small text-muted">{{item.date}}, 10:15</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
