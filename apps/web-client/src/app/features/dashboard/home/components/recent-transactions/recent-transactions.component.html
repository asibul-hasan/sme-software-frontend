<div class="bg-surface rounded-2xl shadow-sm border border-line flex flex-col h-full overflow-hidden">
  <div class="p-4 flex justify-between items-center bg-transparent border-b-0">
    <h6 class="mb-0 font-bold text-lg text-content">Recent Transactions</h6>
    <div class="bg-muted p-1 rounded-xl flex gap-1">
      <button class="px-3 py-1 rounded-lg text-sm font-bold transition-colors border-none" [ngClass]="activeTab === 'sales' ? 'bg-surface shadow-sm text-content' : 'bg-transparent text-subtle hover:text-content'" (click)="activeTab = 'sales'">Sales</button>
      <button class="px-3 py-1 rounded-lg text-sm font-bold transition-colors border-none" [ngClass]="activeTab === 'purchases' ? 'bg-surface shadow-sm text-content' : 'bg-transparent text-subtle hover:text-content'" (click)="activeTab = 'purchases'">Purchases</button>
    </div>
  </div>
  
  <div class="p-0 flex-1">
    <div class="px-4 pb-4">
      <!-- Sales List -->
      <div *ngIf="activeTab === 'sales'">
        <div *ngFor="let item of sales" class="flex justify-between items-center py-3 border-b border-line last:border-0">
          <div>
            <div class="font-bold text-sm mb-0 text-content">{{item.id}}</div>
            <div class="text-[10px] text-subtle">{{item.entity}}</div>
          </div>
          <div class="text-end">
            <div class="font-black text-success text-sm">+ ৳ {{item.amount}}</div>
            <div class="text-[10px] text-subtle">{{item.date}}, 12:30</div>
          </div>
        </div>
      </div>

      <!-- Purchases List -->
      <div *ngIf="activeTab === 'purchases'">
        <div *ngFor="let item of purchases" class="flex justify-between items-center py-3 border-b border-line last:border-0">
          <div>
            <div class="font-bold text-sm mb-0 text-content">{{item.id}}</div>
            <div class="text-[10px] text-subtle">{{item.entity}}</div>
          </div>
          <div class="text-end">
            <div class="font-black text-danger text-sm">- ৳ {{item.amount}}</div>
            <div class="text-[10px] text-subtle">{{item.date}}, 10:15</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
