<div class="bg-surface rounded-2xl shadow-sm border border-line flex flex-col h-full">
  <div class="p-4 border-b-0">
    <h6 class="mb-0 font-bold text-lg text-content">Branch Performance</h6>
    <span class="text-subtle text-[10px]">Revenue comparison by branch</span>
  </div>
  <div class="p-4 pt-0 flex-1 flex flex-col">
    <div *ngFor="let branch of branches" class="mb-4">
      <div class="flex justify-between items-center mb-1">
        <span class="text-sm font-semibold text-content">{{branch.name}}</span>
        <span class="text-[10px] font-black text-content">৳ {{branch.revenue}}</span>
      </div>
      <div class="w-full bg-muted rounded-full h-1.5">
        <div class="h-1.5 rounded-full" [style.width.%]="branch.percentage" [style.background-color]="branch.color"></div>
      </div>
    </div>
    
    <div class="mt-auto pt-4 border-t border-line">
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <div class="w-2 h-2 rounded-full bg-warning me-2"></div>
          <span class="text-[10px] text-subtle font-bold">LOW STOCK ITEMS</span>
        </div>
        <span class="text-sm font-black text-warning">23</span>
      </div>
    </div>
  </div>
</div>
