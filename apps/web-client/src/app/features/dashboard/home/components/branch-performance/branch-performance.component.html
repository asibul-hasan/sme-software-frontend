<div class="card border-0 shadow-sm h-100">
  <div class="card-header border-0 py-3">
    <h6 class="mb-0 fw-bold">Branch Performance</h6>
    <span class="text-muted xx-small">Revenue comparison by branch</span>
  </div>
  <div class="card-body">
    <div *ngFor="let branch of branches" class="mb-3">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="small fw-semibold">{{branch.name}}</span>
        <span class="xx-small fw-black">৳ {{branch.revenue}}</span>
      </div>
      <div class="progress" style="height: 6px;">
        <div class="progress-bar" role="progressbar" [style.width.%]="branch.percentage" [style.background-color]="branch.color"></div>
      </div>
    </div>
    
    <div class="mt-4 pt-3 border-top">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <div class="indicator bg-warning me-2"></div>
          <span class="xx-small text-muted fw-bold">LOW STOCK ITEMS</span>
        </div>
        <span class="small fw-black text-warning">23</span>
      </div>
    </div>
  </div>
</div>
