<div class="card border-0 shadow-sm h-100 overflow-hidden">
  <div class="card-header border-0 py-3 d-flex justify-content-between align-items-center bg-transparent">
    <h6 class="mb-0 fw-bold">Purchase Orders</h6>
    <a href="javascript:void(0)" class="text-primary xx-small fw-bold text-decoration-none">VIEW ALL</a>
  </div>
  
  <div class="card-body p-0">
    <div class="transaction-list px-3 pb-3">
      <div *ngFor="let order of orders" class="transaction-item d-flex justify-content-between align-items-center py-3 border-bottom-themed">
        <div>
          <div class="fw-bold small mb-0">{{order.id}}</div>
          <div class="xx-small text-muted">{{order.supplier}}</div>
        </div>
        <div class="text-end">
          <div class="fw-black text-dark small">৳ {{order.amount}}</div>
          <div class="mt-1">
            <span class="badge-pill-2d" [ngClass]="'bg-' + order.statusColor + '-light text-' + order.statusColor">
              {{order.status}}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
