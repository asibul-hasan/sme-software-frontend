<div class="bg-surface rounded-2xl shadow-sm border border-line flex flex-col h-full overflow-hidden">
  <div class="p-4 flex justify-between items-center bg-transparent border-b-0">
    <h6 class="mb-0 font-bold text-lg text-content">Purchase Orders</h6>
    <a href="javascript:void(0)" class="text-primary text-[10px] font-bold no-underline hover:underline">VIEW ALL</a>
  </div>
  
  <div class="p-0 flex-1">
    <div class="px-4 pb-4">
      <div *ngFor="let order of orders" class="flex justify-between items-center py-3 border-b border-line last:border-0">
        <div>
          <div class="font-bold text-sm mb-0 text-content">{{order.id}}</div>
          <div class="text-[10px] text-subtle">{{order.supplier}}</div>
        </div>
        <div class="text-end">
          <div class="font-black text-content text-sm">৳ {{order.amount}}</div>
          <div class="mt-1">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold" [ngClass]="'bg-' + order.statusColor + '/10 text-' + order.statusColor">
              {{order.status}}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
