<div class="card border-0 shadow-sm h-100">
  <div class="card-header border-0 py-3">
    <h6 class="mb-0 fw-bold">Quick Actions</h6>
  </div>
  <div class="card-body pt-0">
    <div class="row g-2">
      <div class="col-6" *ngFor="let action of actions">
        <button class="action-btn-v2 w-100 d-flex align-items-center p-3 border-0 bg-light-2d rounded-3">
          <div class="icon-box-sm-v2 me-3" [ngClass]="'bg-' + action.color + '-light text-' + action.color">
            <i class="bi" [ngClass]="action.icon"></i>
          </div>
          <span class="xx-small fw-bold text-start">{{action.label}}</span>
        </button>
      </div>
    </div>
  </div>
</div>
