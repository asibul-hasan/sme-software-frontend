<div class="bg-surface rounded-2xl shadow-sm border border-line flex flex-col h-full">
  <div class="p-4 border-b-0">
    <h6 class="mb-0 font-bold text-lg text-content">Quick Actions</h6>
  </div>
  <div class="p-4 pt-0 flex-1">
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-1" *ngFor="let action of actions">
        <button class="w-full flex items-center p-3 border-none bg-muted hover:bg-opacity-80 transition-colors rounded-2xl cursor-pointer">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center me-3" [ngClass]="'bg-' + action.color + '/10 text-' + action.color">
            <i class="bi text-lg" [ngClass]="action.icon"></i>
          </div>
          <span class="text-[10px] font-bold text-left text-content">{{action.label}}</span>
        </button>
      </div>
    </div>
  </div>
</div>
