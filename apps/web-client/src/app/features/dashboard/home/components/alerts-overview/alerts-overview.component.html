<div class="bg-surface rounded-2xl shadow-sm border border-line flex flex-col h-full">
  <div class="p-4 border-b-0">
    <h6 class="mb-0 font-bold text-lg text-content">Tasks & Alerts</h6>
  </div>
  <div class="p-4 pt-0 flex-1">
    <div *ngFor="let alert of alerts" class="flex items-center mb-3 p-3 rounded-2xl border-none bg-muted hover:bg-opacity-80 transition-colors cursor-pointer last:mb-0">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center me-3" [ngClass]="'bg-' + alert.type + '/10 text-' + alert.type">
        <i class="bi text-lg" [ngClass]="alert.icon"></i>
      </div>
      <span class="text-xs font-bold text-subtle flex-1">{{alert.label}}</span>
      <i class="bi bi-chevron-right text-subtle text-xs"></i>
    </div>
  </div>
</div>
