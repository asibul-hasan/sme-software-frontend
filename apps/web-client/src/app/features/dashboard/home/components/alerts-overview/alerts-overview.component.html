<div class="card border-0 shadow-sm h-100">
  <div class="card-header border-0 py-3">
    <h6 class="mb-0 fw-bold">Tasks & Alerts</h6>
  </div>
  <div class="card-body pt-0">
    <div *ngFor="let alert of alerts" class="alert-item-v2 d-flex align-items-center mb-2 p-2 rounded-3 border-0 bg-light-2d cursor-pointer">
      <div class="alert-icon-v2 me-3 text-center" [ngClass]="'text-' + alert.type">
        <i class="bi" [ngClass]="alert.icon"></i>
      </div>
      <span class="xx-small fw-bold text-muted flex-grow-1">{{alert.label}}</span>
      <i class="bi bi-chevron-right text-muted xx-small"></i>
    </div>
  </div>
</div>
