<div class="card border-0 shadow-sm h-100 inventory-card">
  <div class="card-header border-0 py-3 d-flex justify-content-between align-items-center">
    <h6 class="mb-0 fw-bold">Inventory Snapshot</h6>
    <i class="bi bi-box-seam text-primary"></i>
  </div>
  <div class="card-body pt-0">
    <!-- Total Items Main Box -->
    <div class="total-items-box p-3 rounded-4 mb-3 d-flex align-items-center justify-content-between">
      <div>
        <div class="xx-small text-muted fw-bold text-uppercase">Total Items</div>
        <div class="h3 fw-black mb-0">1,254</div>
      </div>
      <div class="trend-icon bg-success-light text-success">
        <i class="bi bi-arrow-up-right"></i>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="row g-2 mb-3">
      <div class="col-6">
        <div class="stat-box p-3 rounded-4 border-warning-2d">
          <div class="text-warning fw-bold h5 mb-1">23</div>
          <div class="xx-small text-muted fw-bold">LOW STOCK</div>
        </div>
      </div>
      <div class="col-6">
        <div class="stat-box p-3 rounded-4 border-danger-2d">
          <div class="text-danger fw-bold h5 mb-1">07</div>
          <div class="xx-small text-muted fw-bold">OUT OF STOCK</div>
        </div>
      </div>
    </div>

    <!-- Stock Value Wide Box -->
    <div class="stock-value-box p-3 rounded-4 d-flex align-items-center">
      <div class="icon-circle bg-primary-light text-primary me-3">
        <i class="bi bi-currency-dollar"></i>
      </div>
      <div>
        <div class="xx-small text-muted fw-bold text-uppercase">Estimated Stock Value</div>
        <div class="h5 fw-black mb-0">৳ 5,245,300</div>
      </div>
    </div>
  </div>
</div>
