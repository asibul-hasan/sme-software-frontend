<app-page-form-layout
  [title]="'Profit & Loss'"
  [subtitle]="'Income statement over a date window — net profit = income − expense'"
  [icon]="'trending_up'"
  [hasSidebar]="false"
  [showSave]="false" [showNew]="false" [showDelete]="false"
  [isLoading]="isLoading()"
>
  <div formContent class="h-full flex flex-col">
    <div class="form-section-card card shrink-0">
      <div class="card-body">
        <div class="flex items-end gap-3 flex-wrap">
          <div class="field-group" style="min-width: 170px">
            <label class="field-label" for="from">From Date</label>
            <app-date-picker [(ngModel)]="from" (ngModelChange)="load()" placeholder="From date" />
          </div>
          <div class="field-group" style="min-width: 170px">
            <label class="field-label" for="to">To Date</label>
            <app-date-picker [(ngModel)]="to" (ngModelChange)="load()" placeholder="To date" />
          </div>
          <div class="ml-auto flex items-center gap-4">
            <div class="text-end"><span class="field-label mb-0 block">Total Income</span><div class="font-bold">{{ totalIncome() | number: '1.2-2' }}</div></div>
            <div class="text-end"><span class="field-label mb-0 block">Total Expense</span><div class="font-bold">{{ totalExpense() | number: '1.2-2' }}</div></div>
            <div class="text-end">
              <span class="field-label mb-0 block">Net {{ isProfit() ? 'Profit' : 'Loss' }}</span>
              <div class="font-bold" [class.text-success]="isProfit()" [class.text-danger]="!isProfit()">{{ netProfit() | number: '1.2-2' }}</div>
            </div>
            <span class="list-item-tag" [class.list-item-tag--primary]="isProfit()" [class.list-item-tag--warning]="!isProfit()">
              {{ isProfit() ? 'Profit' : 'Loss' }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1 min-h-0 mt-1">
      <div class="form-section-card card fill-card flex-1 flex flex-col min-h-0">
        <div class="card-header"><h4 class="card-header__title mb-0 font-bold"><mat-icon class="mr-2 align-middle">south_west</mat-icon> Income</h4></div>
        <div class="card-body p-0 flex-1 flex flex-col min-h-0">
          <app-erp-grid [config]="incomeGridConfig" [data]="income()" />
        </div>
      </div>
      <div class="form-section-card card fill-card flex-1 flex flex-col min-h-0">
        <div class="card-header"><h4 class="card-header__title mb-0 font-bold"><mat-icon class="mr-2 align-middle">north_east</mat-icon> Expense</h4></div>
        <div class="card-body p-0 flex-1 flex flex-col min-h-0">
          <app-erp-grid [config]="expenseGridConfig" [data]="expense()" />
        </div>
      </div>
    </div>
  </div>
</app-page-form-layout>
