<app-page-form-layout
  [title]="'Chart of Accounts'"
  [subtitle]="'GL account master'"
  [icon]="'menu_book'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Accounts'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  [sortDirection]="model.sortDirection()"
  (sortDirectionChange)="model.sortDirection.set($event); model.pager.reset()"
  (save)="onSave()" (new)="onNew()" (reset)="onReset()" (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()" [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (item of model.pager.paged(); track item.account_no) {
      <button type="button" class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === item.account_no" (click)="select(item)">
        <span class="status-dot status-dot--corner" [class.status-dot--active]="item.is_active === 1" [class.status-dot--inactive]="item.is_active !== 1"
          [title]="item.is_active === 1 ? 'Active' : 'Inactive'"></span>
        <h6 class="list-item-title mb-0 text-truncate" style="padding-right: 16px">{{ item.account_name }}</h6>
        <p class="list-item-subtitle mb-0 text-truncate">{{ item.account_code }} · {{ item.account_group_name }}</p>
        <div class="list-item-meta">
          @if (item.control_type) { <span class="list-item-tag list-item-tag--warning">{{ controlLabel(item.control_type) }}</span> }
          @if (item.is_postable !== 1) { <span class="list-item-tag">Header</span> }
        </div>
      </button>
    }
    @if (model.filtered().length === 0) { <div class="list-empty-state"><mat-icon>menu_book</mat-icon><p>No records found</p></div> }
  </div>

  <div formContent>
    <form [formGroup]="formdata" autocomplete="off">
      <div class="row row-group">
        <div class="col-12">
          <div class="form-section-card card">
            <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">menu_book</mat-icon> Account</h4></div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-3"><div class="field-group">
                  <label class="field-label required" for="account_code">Account Code</label>
                  <input type="text" id="account_code" formControlName="account_code" class="form-control text-uppercase" placeholder="e.g. 1010-001" (input)="toUpper('account_code')" />
                </div></div>
                <div class="col-md-5"><div class="field-group">
                  <label class="field-label required" for="account_name">Account Name</label>
                  <input type="text" id="account_name" formControlName="account_name" class="form-control" placeholder="e.g. Cash in Hand" />
                </div></div>
                <div class="col-md-4"><div class="field-group">
                  <label class="field-label required" for="account_group_no">Account Group</label>
                  <ng-select id="account_group_no" formControlName="account_group_no" bindLabel="group_name" bindValue="account_group_no" [items]="model.groups()" placeholder="Select group"></ng-select>
                </div></div>
                <div class="col-md-4"><div class="field-group">
                  <label class="field-label" for="control_type">Control Type</label>
                  <ng-select id="control_type" formControlName="control_type" placeholder="None (plain)">
                    @for (o of controlTypes; track o.value) { <ng-option [value]="o.value">{{ o.label }}</ng-option> }
                  </ng-select>
                </div></div>
                <div class="col-md-2"><div class="field-group">
                  <label class="field-label" for="opening_balance">Opening Balance</label>
                  <input type="number" id="opening_balance" formControlName="opening_balance" class="form-control" step="0.01" />
                </div></div>
                <div class="col-md-2"><div class="field-group">
                  <label class="field-label" for="opening_dr_cr">Opening Dr/Cr</label>
                  <ng-select id="opening_dr_cr" formControlName="opening_dr_cr" [clearable]="false">
                    @for (o of drCr; track o.value) { <ng-option [value]="o.value">{{ o.label }}</ng-option> }
                  </ng-select>
                </div></div>
                <div class="col-md-4 d-flex gap-2">
                  <div class="field-group flex-fill"><label class="field-label">Postable</label>
                    <div class="custom--checkbox"><mat-checkbox color="primary" [checked]="formdata.get('is_postable')?.value === 1" (change)="formdata.get('is_postable')?.setValue($event.checked ? 1 : 0)"><span class="field-label mb-0" style="cursor:pointer">Postable</span></mat-checkbox></div>
                  </div>
                  <div class="field-group flex-fill"><label class="field-label">Status</label>
                    <div class="custom--checkbox"><mat-checkbox color="primary" [checked]="formdata.get('is_active')?.value === 1" (change)="formdata.get('is_active')?.setValue($event.checked ? 1 : 0)"><span class="field-label mb-0" style="cursor:pointer">Active</span></mat-checkbox></div>
                  </div>
                </div>
                <div class="col-md-4 d-flex gap-2">
                  <div class="field-group flex-fill"><label class="field-label">Cost Center</label>
                    <div class="custom--checkbox"><mat-checkbox color="primary" [checked]="formdata.get('requires_cost_center')?.value === 1" (change)="formdata.get('requires_cost_center')?.setValue($event.checked ? 1 : 0)"><span class="field-label mb-0" style="cursor:pointer">Required</span></mat-checkbox></div>
                  </div>
                  <div class="field-group flex-fill"><label class="field-label">Party</label>
                    <div class="custom--checkbox"><mat-checkbox color="primary" [checked]="formdata.get('requires_party')?.value === 1" (change)="formdata.get('requires_party')?.setValue($event.checked ? 1 : 0)"><span class="field-label mb-0" style="cursor:pointer">Required</span></mat-checkbox></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
