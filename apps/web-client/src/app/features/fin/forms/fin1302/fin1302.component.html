<app-page-form-layout
  [title]="'Account Ledger'"
  [subtitle]="'Movements for one account with opening + running balance'"
  [icon]="'receipt_long'"
  [hasSidebar]="false"
  [showSave]="false" [showNew]="false" [showDelete]="false"
  [isLoading]="isLoading()"
>
  <div formContent class="h-100 d-flex flex-column">
    <div class="form-section-card card flex-shrink-0">
      <div class="card-body">
        <div class="d-flex align-items-end gap-3 flex-wrap">
          <div class="field-group" style="min-width: 280px">
            <label class="field-label" for="acc">Account</label>
            <ng-select id="acc" [(ngModel)]="accountNo" (ngModelChange)="load()" bindLabel="account_name" bindValue="account_no" [items]="accounts()" [clearable]="false" placeholder="Select account">
              <ng-template ng-option-tmp let-item="item">{{ item.account_name }} ({{ item.account_code }})</ng-template>
            </ng-select>
          </div>
          <div class="field-group" style="min-width:150px"><label class="field-label" for="from">From</label>
            <input type="date" id="from" class="form-control" [(ngModel)]="from" (change)="load()" /></div>
          <div class="field-group" style="min-width:150px"><label class="field-label" for="to">To</label>
            <input type="date" id="to" class="form-control" [(ngModel)]="to" (change)="load()" /></div>
          @if (result(); as r) {
            <div class="ms-auto d-flex align-items-center gap-4">
              <div class="text-end"><span class="field-label mb-0">Opening</span><div class="fw-semibold">{{ r.opening_balance | number: '1.2-2' }}</div></div>
              <div class="text-end"><span class="field-label mb-0">Closing</span><div class="fw-bold" [style.color]="r.closing_balance >= 0 ? 'var(--success)' : 'var(--danger)'">{{ r.closing_balance | number: '1.2-2' }}</div></div>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="form-section-card card fill-card mt-1">
      <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">receipt_long</mat-icon> Ledger</h4></div>
      <div class="card-body p-0">
        <app-common-table [columns]="columns" [data]="tableData()" [config]="config" />
      </div>
    </div>
  </div>
</app-page-form-layout>
