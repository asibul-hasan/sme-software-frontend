<app-page-form-layout
  [title]="'Account Ledger'"
  [subtitle]="'Movements for one account with opening + running balance'"
  [icon]="'receipt_long'"
  [hasSidebar]="false"
  [showSave]="false" [showNew]="false" [showDelete]="false"
  [isLoading]="isLoading()"
>
  <div formContent class="h-full flex flex-col">
    <div class="form-section-card card shrink-0">
      <div class="card-body">
        <div class="flex items-end gap-3 flex-wrap">
          <div class="field-group" style="min-width: 280px">
            <label class="field-label" for="acc">Account</label>
            <ng-select id="acc" [(ngModel)]="accountNo" (ngModelChange)="load()" bindLabel="account_name" bindValue="account_no" [items]="accounts()" [clearable]="false" placeholder="Select account">
              <ng-template ng-option-tmp let-item="item">{{ item.account_name }} ({{ item.account_code }})</ng-template>
            </ng-select>
          </div>
          <div class="field-group" style="min-width:150px"><label class="field-label" for="from">From</label>
            <app-date-picker [(ngModel)]="from" (ngModelChange)="load()" placeholder="From date" /></div>
          <div class="field-group" style="min-width:150px"><label class="field-label" for="to">To</label>
            <app-date-picker [(ngModel)]="to" (ngModelChange)="load()" placeholder="To date" /></div>
          @if (result(); as r) {
            <div class="ml-auto flex items-center gap-4">
              <div class="text-end"><span class="field-label mb-0 block">Opening</span><div class="font-semibold">{{ r.opening_balance | appDecimal }}</div></div>
              <div class="text-end"><span class="field-label mb-0 block">Closing</span><div class="font-bold" [class.text-success]="r.closing_balance >= 0" [class.text-danger]="r.closing_balance < 0">{{ r.closing_balance | appDecimal }}</div></div>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="form-section-card card fill-card mt-1 flex-1 flex flex-col min-h-0">
      <div class="card-header"><h4 class="card-header__title mb-0 font-bold"><mat-icon class="mr-2 align-middle">receipt_long</mat-icon> Ledger</h4></div>
      <div class="card-body p-0 flex-1 flex flex-col min-h-0">
        <app-erp-grid [config]="gridConfig" [data]="result()?.rows || []" />
      </div>
    </div>
  </div>
</app-page-form-layout>
