<app-page-form-layout
  [title]="'Cash Flow'"
  [subtitle]="'Direct cash flow over cash & bank accounts — opening + receipts − payments = closing'"
  [icon]="'payments'"
  [hasSidebar]="false"
  [showSave]="false" [showNew]="false" [showDelete]="false"
  [isLoading]="isLoading()"
>
  <div formContent class="h-100 d-flex flex-column">
    <div class="form-section-card card flex-shrink-0">
      <div class="card-body">
        <div class="d-flex align-items-end gap-3 flex-wrap">
          <div class="field-group" style="min-width: 170px">
            <label class="field-label" for="from">From Date</label>
            <input type="date" id="from" class="form-control" [(ngModel)]="from" (change)="load()" />
          </div>
          <div class="field-group" style="min-width: 170px">
            <label class="field-label" for="to">To Date</label>
            <input type="date" id="to" class="form-control" [(ngModel)]="to" (change)="load()" />
          </div>
          <div class="ms-auto d-flex align-items-center gap-4 flex-wrap">
            <div class="text-end"><span class="field-label mb-0">Opening Cash</span><div class="fw-bold">{{ openingCash() | number: '1.2-2' }}</div></div>
            <div class="text-end"><span class="field-label mb-0">Receipts</span><div class="fw-bold text-success">{{ totalReceipts() | number: '1.2-2' }}</div></div>
            <div class="text-end"><span class="field-label mb-0">Payments</span><div class="fw-bold text-danger">{{ totalPayments() | number: '1.2-2' }}</div></div>
            <div class="text-end"><span class="field-label mb-0">Net</span><div class="fw-bold" [class.text-success]="netCashFlow() >= 0" [class.text-danger]="netCashFlow() < 0">{{ netCashFlow() | number: '1.2-2' }}</div></div>
            <div class="text-end"><span class="field-label mb-0">Closing Cash</span><div class="fw-bold">{{ closingCash() | number: '1.2-2' }}</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section-card card fill-card mt-1">
      <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">account_balance_wallet</mat-icon> Cash & Bank Accounts</h4></div>
      <div class="card-body p-0">
        <app-common-table [columns]="columns" [data]="tableData()" [config]="config" />
      </div>
    </div>
  </div>
</app-page-form-layout>
