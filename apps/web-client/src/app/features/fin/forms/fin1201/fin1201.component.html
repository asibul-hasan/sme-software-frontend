<app-page-form-layout
  [title]="'Auto-Posting Monitor'"
  [subtitle]="'Outbox events that become GL vouchers — re-drive parked (Failed) postings'"
  [icon]="'sync_problem'"
  [hasSidebar]="false"
  [showSave]="false" [showNew]="false" [showDelete]="false"
  [isLoading]="isLoading()"
>
  <div formContent class="h-full flex flex-col">
    <div class="form-section-card card shrink-0">
      <div class="card-body">
        <div class="flex items-end gap-3 flex-wrap">
          <div class="field-group" style="min-width: 200px">
            <label class="field-label" for="status">Status</label>
            <ng-select id="status" [(ngModel)]="status" (ngModelChange)="load()" [clearable]="false">
              @for (o of statusOptions; track o.value) { <ng-option [value]="o.value">{{ o.label }}</ng-option> }
            </ng-select>
          </div>
          <button type="button" class="btn-action btn-save h-[42px] px-4" (click)="drain()" [disabled]="isBusy()">
            <mat-icon class="text-[18px] w-[18px] h-[18px]">play_circle</mat-icon> Drain Pending Now
          </button>
          <div class="ml-auto flex items-center gap-2 text-[var(--text-muted)]"><mat-icon>inbox</mat-icon><span>{{ rows().length }} event(s)</span></div>
        </div>
      </div>
    </div>

    <div class="form-section-card card fill-card mt-1 flex-1 flex flex-col min-h-0">
      <div class="card-header"><h4 class="card-header__title mb-0 font-bold"><mat-icon class="mr-2 align-middle">sync_problem</mat-icon> Outbox Events</h4></div>
      <div class="card-body p-0 flex-1 flex flex-col min-h-0">
        <app-erp-grid [config]="gridConfig" [data]="rows()" />
      </div>
    </div>
  </div>
</app-page-form-layout>
