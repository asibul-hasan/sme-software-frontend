<app-page-form-layout
  [title]="'Bank / Cash Account'"
  [subtitle]="'Banking detail linked to a GL Bank/Cash account'"
  [icon]="'account_balance'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Bank Accounts'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  [sortDirection]="model.sortDirection()"
  (sortDirectionChange)="model.sortDirection.set($event); model.pager.reset()"
  (save)="onSave()" (new)="onNew()" (reset)="onReset()" (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()" [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (item of model.pager.paged(); track item.bank_account_no) {
      <button type="button" class="list-group-item list-group-item-action" [class.active]="model.selectedNo() === item.bank_account_no" (click)="select(item)">
        <span class="status-dot status-dot--corner" [class.status-dot--active]="item.is_active === 1" [class.status-dot--inactive]="item.is_active !== 1" [title]="item.is_active === 1 ? 'Active' : 'Inactive'"></span>
        <div class="flex items-baseline gap-1" style="min-width: 0; padding-right: 16px">
          <h6 class="list-item-title mb-0 truncate">{{ item.bank_name || item.account_title || item.bank_account_id }}</h6>
          <span class="text-subtle">&middot;</span>
          <span class="list-item-id">{{ item.account_number }}</span>
        </div>
      </button>
    }
    @if (model.filtered().length === 0) { 
      <div class="list-empty-state">
        <mat-icon>account_balance</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent class="p-4 md:p-5">
    <form [formGroup]="formdata" autocomplete="off" class="w-full">
      <app-form-section title="Bank / Cash Account" icon="account_balance">
        <!-- Row 1 -->
        <app-form-field label="Account ID" [span]="3" [required]="true">
          <input type="text" id="bank_account_id" formControlName="bank_account_id" class="form-control uppercase" placeholder="e.g. BANK-01" (input)="toUpper('bank_account_id')" />
        </app-form-field>
        
        <app-form-field label="GL Bank/Cash Account" [span]="5" [required]="true">
          <ng-select id="account_no" formControlName="account_no" bindValue="account_no" [items]="model.bankCashAccounts()" placeholder="Select Bank/Cash account">
            <ng-template ng-label-tmp let-item="item">
              <span class="font-medium text-slate-800">{{ item.account_code }} <span class="text-slate-400 font-normal mx-0.5">·</span> {{ item.account_name }}</span>
            </ng-template>
            <ng-template ng-option-tmp let-item="item">
              <span class="font-medium text-slate-800">{{ item.account_code }}</span> <span class="text-slate-500 text-[12px] ml-1">{{ item.account_name }}</span>
            </ng-template>
          </ng-select>
        </app-form-field>
        
        <app-form-field label="Opening Balance" [span]="4">
          <input type="number" id="opening_balance" formControlName="opening_balance" class="form-control" step="0.01" />
        </app-form-field>

        <!-- Row 2 -->
        <app-form-field label="Bank Name" [span]="4">
          <input type="text" id="bank_name" formControlName="bank_name" class="form-control" />
        </app-form-field>
        
        <app-form-field label="Branch Name" [span]="4">
          <input type="text" id="branch_name" formControlName="branch_name" class="form-control" />
        </app-form-field>
        
        <app-form-field label="Account Title" [span]="4">
          <input type="text" id="account_title" formControlName="account_title" class="form-control" />
        </app-form-field>

        <!-- Row 3 -->
        <app-form-field label="Account Number" [span]="3">
          <input type="text" id="account_number" formControlName="account_number" class="form-control" />
        </app-form-field>
        
        <app-form-field label="Routing No" [span]="3">
          <input type="text" id="routing_number" formControlName="routing_number" class="form-control" />
        </app-form-field>
        
        <app-form-field label="SWIFT" [span]="3">
          <input type="text" id="swift_code" formControlName="swift_code" class="form-control" />
        </app-form-field>
        
        <app-form-field label="Status" [span]="3">
          <mat-checkbox color="primary" [checked]="formdata.get('is_active')?.value === 1" (change)="formdata.get('is_active')?.setValue($event.checked ? 1 : 0)">
            <span class="text-[13.5px] font-bold text-slate-700 select-none">Active</span>
          </mat-checkbox>
        </app-form-field>
      </app-form-section>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
