<app-page-form-layout
  [title]="'Trial Balance'"
  [subtitle]="'Per-account balances as of a date — debit total must equal credit total'"
  [icon]="'balance'"
  [hasSidebar]="false"
  [showSave]="false" [showNew]="false" [showDelete]="false"
  [isLoading]="isLoading()"
>
  <div formContent class="h-full flex flex-col">
    <div class="form-section-card card shrink-0">
      <div class="card-body">
        <div class="flex items-end gap-3 flex-wrap">
          <div class="field-group" style="min-width: 180px">
            <label class="field-label" for="asOf">As of Date</label>
            <app-date-picker [(ngModel)]="asOf" (ngModelChange)="load()" placeholder="Select date" />
          </div>
          <div class="ml-auto flex items-center gap-4">
            <div class="text-end"><span class="field-label mb-0 block">Total Debit</span><div class="font-bold">{{ totalDebit() | number: '1.2-2' }}</div></div>
            <div class="text-end"><span class="field-label mb-0 block">Total Credit</span><div class="font-bold">{{ totalCredit() | number: '1.2-2' }}</div></div>
            <span class="list-item-tag" [class.list-item-tag--primary]="balanced()" [class.list-item-tag--warning]="!balanced()">
              {{ balanced() ? 'Balanced' : 'Out of balance' }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section-card card fill-card mt-1 flex-1 flex flex-col min-h-0">
      <div class="card-header"><h4 class="card-header__title mb-0 font-bold"><mat-icon class="mr-2 align-middle">balance</mat-icon> Trial Balance</h4></div>
      <div class="card-body p-0 flex-1 flex flex-col min-h-0">
        <app-erp-grid [config]="gridConfig" [data]="rows()" />
      </div>
    </div>
  </div>
</app-page-form-layout>
