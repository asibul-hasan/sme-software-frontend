<app-page-form-layout
  [title]="'Account Group'"
  [subtitle]="'Chart-of-accounts group tree (Asset / Liability / Equity / Income / Expense)'"
  [icon]="'account_tree'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Account Groups'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  [sortDirection]="model.sortDirection()"
  (sortDirectionChange)="model.sortDirection.set($event); model.pager.reset()"
  (save)="onSave()" (new)="onNew()" (reset)="onReset()" (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()" [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (item of model.pager.paged(); track item.account_group_no) {
      <button type="button" class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === item.account_group_no" (click)="select(item)">
        <span class="status-dot status-dot--corner" [class.status-dot--active]="item.is_active === 1" [class.status-dot--inactive]="item.is_active !== 1"
          [title]="item.is_active === 1 ? 'Active' : 'Inactive'"></span>
        <h6 class="list-item-title mb-0 text-truncate" style="padding-right: 16px">{{ item.group_name }}</h6>
        <p class="list-item-subtitle mb-0 text-truncate">{{ item.account_group_id }}</p>
        <div class="list-item-meta">
          <span class="list-item-tag list-item-tag--primary">{{ rootLabel(item.root_type) }}</span>
          @if (item.parent_group_name) { <span class="list-item-chip"><mat-icon>subdirectory_arrow_right</mat-icon><span>{{ item.parent_group_name }}</span></span> }
        </div>
      </button>
    }
    @if (model.filtered().length === 0) { <div class="list-empty-state"><mat-icon>account_tree</mat-icon><p>No records found</p></div> }
  </div>

  <div formContent>
    <form [formGroup]="formdata" autocomplete="off">
      <div class="row row-group">
        <div class="col-12">
          <div class="form-section-card card">
            <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">account_tree</mat-icon> Group Details</h4></div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-3"><div class="field-group">
                  <label class="field-label required" for="account_group_id">Group ID</label>
                  <input type="text" id="account_group_id" formControlName="account_group_id" class="form-control text-uppercase" placeholder="e.g. AST-CA" (input)="toUpper('account_group_id')" />
                </div></div>
                <div class="col-md-5"><div class="field-group">
                  <label class="field-label required" for="group_name">Group Name</label>
                  <input type="text" id="group_name" formControlName="group_name" class="form-control" placeholder="e.g. Current Assets" />
                </div></div>
                <div class="col-md-4"><div class="field-group">
                  <label class="field-label required" for="root_type">Root Type</label>
                  <ng-select id="root_type" formControlName="root_type" [clearable]="false">
                    @for (o of rootTypes; track o.value) { <ng-option [value]="o.value">{{ o.label }}</ng-option> }
                  </ng-select>
                </div></div>
                <div class="col-md-5"><div class="field-group">
                  <label class="field-label" for="parent_group_no">Parent Group</label>
                  <ng-select id="parent_group_no" formControlName="parent_group_no" bindLabel="group_name" bindValue="account_group_no" [items]="model.parentOptions()" placeholder="None (top level)"></ng-select>
                </div></div>
                <div class="col-md-3"><div class="field-group">
                  <label class="field-label" for="normal_balance">Normal Balance</label>
                  <ng-select id="normal_balance" formControlName="normal_balance" placeholder="Auto from root">
                    @for (o of drCr; track o.value) { <ng-option [value]="o.value">{{ o.label }}</ng-option> }
                  </ng-select>
                </div></div>
                <div class="col-md-2"><div class="field-group">
                  <label class="field-label" for="order_sl">Order</label>
                  <input type="number" id="order_sl" formControlName="order_sl" class="form-control" />
                </div></div>
                <div class="col-md-2"><div class="field-group">
                  <label class="field-label">Control</label>
                  <div class="custom--checkbox">
                    <mat-checkbox color="primary" [checked]="formdata.get('is_control')?.value === 1" (change)="formdata.get('is_control')?.setValue($event.checked ? 1 : 0)">
                      <span class="field-label mb-0" style="cursor:pointer">Control</span>
                    </mat-checkbox>
                  </div>
                </div></div>
                <div class="col-md-2"><div class="field-group">
                  <label class="field-label">Status</label>
                  <div class="custom--checkbox">
                    <mat-checkbox color="primary" [checked]="formdata.get('is_active')?.value === 1" (change)="formdata.get('is_active')?.setValue($event.checked ? 1 : 0)">
                      <span class="field-label mb-0" style="cursor:pointer">Active</span>
                    </mat-checkbox>
                  </div>
                </div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
