<app-page-form-layout
  [title]="'Voucher Types'"
  [subtitle]="'Define and manage voucher types and their configurations'"
  [icon]="'category'"
  [hasSidebar]="false"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  (save)="onSave()"
  [showNew]="false"
  [showDelete]="false"
  [isLoading]="model.isLoading()"
  [isSaving]="model.isSaving()"
>
  <div formContent class="h-100 d-flex flex-column">
    <div class="form-section-card card fill-card mt-1" style="flex:1 1 auto; min-height:0; display:flex; flex-direction:column">
      <div class="card-header d-flex align-items-center gap-2 flex-wrap">
        <h4 class="card-header__title mb-0 fw-bold">
          <mat-icon class="me-2 align-middle">category</mat-icon> Voucher Types
        </h4>
        <button type="button" class="btn-action btn-new btn-row-add ms-2" uiTooltip="Add Row" (click)="model.addRow()">
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div class="card-body p-0" style="flex:1 1 auto; min-height:0; display:flex; flex-direction:column">
        <app-common-table
          [data]="tableData()"
          [columns]="tableColumns()"
          [config]="tableConfig"
        ></app-common-table>
      </div>
    </div>
  </div>
</app-page-form-layout>
