<app-page-form-layout
  [title]="'Voucher Types'"
  [subtitle]="'Define and manage voucher types and their configurations'"
  [icon]="'category'"
  [hasSidebar]="false"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  (save)="onSave()"
  [showReset]="true"
  (reset)="onReset()"
  [showNew]="false"
  [showDelete]="false"
  [isLoading]="model.isLoading()"
  [isSaving]="model.isSaving()"
>
  <div formContent class="h-full flex flex-col">
    <div class="form-section-card card fill-card mt-1 flex-1 flex flex-col min-h-0">
      <div class="card-header flex items-center gap-2 flex-wrap">
        <h4 class="card-header__title mb-0 font-bold">
          <mat-icon class="mr-2 align-middle">category</mat-icon> Voucher Types
        </h4>
        <button type="button" class="btn-action btn-new btn-row-add ml-2" uiTooltip="Add Row" (click)="onAddRow()">
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div class="card-body p-0 flex-1 flex flex-col min-h-0">
        <app-erp-grid 
          #erpGrid
          [config]="gridConfig" 
          [data]="model.filtered()" 
          (rowChange)="onRowChange($event)" 
          (rowRemove)="onRowRemove($event)" />
      </div>
    </div>
  </div>
</app-page-form-layout>
