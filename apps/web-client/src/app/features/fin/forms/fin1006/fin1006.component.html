<app-page-form-layout
  [title]="'GL Account Mapping'"
  [subtitle]="'Which GL account each auto-posting event leg hits'"
  [icon]="'rule'"
  [hasSidebar]="false"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  (save)="onSave()"
  [showReset]="true"
  (reset)="onReset()"
  [showNew]="false"
  [showDelete]="false"
  [isLoading]="model.isLoading()"
  [isSaving]="model.isSaving()"
>
  <div formContent class="h-full flex flex-col">
    <!-- Filter Card -->
    <div class="form-section-card card shrink-0">
      <div class="card-body py-2">
        <div class="flex items-end gap-3 flex-wrap">
          <app-form-field>
            <ng-select
              id="event_type_filter"
              class="bg-white"
              style="min-width: 250px"
              [items]="glEventTypes"
              bindLabel="label"
              bindValue="value"
              placeholder="Filter by Event Type"
              [clearable]="true"
              [ngModel]="model.eventTypeFilter()"
              (ngModelChange)="onEventTypeFilterChange($event)"
            >
            </ng-select>
          </app-form-field>
        </div>
      </div>
    </div>

    <!-- Mappings Table -->
    <div class="form-section-card card fill-card mt-1 flex-1 flex flex-col min-h-0">
      <div class="card-header flex items-center gap-2 flex-wrap">
        <h4 class="card-header__title mb-0 font-bold">
          <mat-icon class="mr-2 align-middle">rule</mat-icon> Mappings
        </h4>
        <button
          type="button"
          class="btn-action btn-new btn-row-add ml-2"
          uiTooltip="Add Row"
          (click)="onAddRow()"
        >
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div class="card-body p-0 flex-1 flex flex-col min-h-0">
        <app-erp-grid 
          #erpGrid
          [config]="gridConfig" 
          [data]="model.filtered()" 
          (rowChange)="onRowChange($event)" 
          (rowRemove)="onRowRemove($event)" 
          (addRow)="onAddRow()"
        />
      </div>
    </div>
  </div>
</app-page-form-layout>
