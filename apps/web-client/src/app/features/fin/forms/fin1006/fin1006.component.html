<app-page-form-layout
  [title]="'GL Account Mapping'"
  [subtitle]="'Which GL account each auto-posting event leg hits'"
  [icon]="'rule'"
  [hasSidebar]="false"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  (save)="onSave()"
  [showNew]="false"
  [showDelete]="false"
  [isLoading]="model.isLoading()"
  [isSaving]="model.isSaving()"
>
  <div formContent class="h-full flex flex-col">
    <!-- Filter Card -->
    <div class="form-section-card card">
      <div class="card-body py-2">
        <div class="row">
          <div class="col-md-4 col-sm-6 col-12">
            <div class="field-group mb-0">
              <ng-select
                id="event_type_filter"
                class="bg-white"
                [items]="eventTypeOptions"
                bindLabel="label"
                bindValue="value"
                placeholder="Filter by Event Type"
                [clearable]="true"
                [ngModel]="model.eventTypeFilter()"
                (ngModelChange)="onEventTypeFilterChange($event)"
              >
              </ng-select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mappings Table -->
    <div
      class="form-section-card card fill-card"
      style="
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      "
    >
      <div class="card-header d-flex align-items-center gap-2 flex-wrap">
        <h4 class="card-header__title mb-0 fw-bold">
          <mat-icon class="me-2 align-middle">rule</mat-icon> Mappings
        </h4>
        <button
          type="button"
          class="btn-action btn-new btn-row-add ms-2"
          uiTooltip="Add Row"
          (click)="model.addRow()"
        >
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div
        class="card-body p-0"
        style="
          flex: 1 1 auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
        "
      >
        <app-common-table
          [data]="tableData()"
          [columns]="tableColumns()"
          [config]="tableConfig"
        ></app-common-table>
      </div>
    </div>
  </div>
</app-page-form-layout>
