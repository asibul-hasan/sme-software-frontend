<app-page-form-layout
  [title]="'Category Setup'"
  [icon]="'account_tree'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Categories'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (c of model.pager.paged(); track c.category_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action p-3"
        [class.active]="model.selectedNo() === c.category_no"
        (click)="model.select(c)"
      >
        <div class="d-flex w-100 justify-content-between align-items-center mb-1">
          <h6 class="mb-0 fw-bold text-truncate">{{ c.category_name }}</h6>
          <span class="badge text-bg-light border">L{{ c.depth ?? 0 }}</span>
        </div>
        <p class="mb-0 small fw-semibold opacity-75 text-truncate">
          {{ c.category_id }}@if (c.parent_category_name) { · under {{ c.parent_category_name }} }
        </p>
      </button>
    }
    @if (model.filtered().length === 0) {
      <div class="p-4 text-center opacity-75"><p class="mb-0 small">No records found</p></div>
    }
  </div>

  <div formContent>
    <form [formGroup]="model.form" autocomplete="off">
      <div class="row row-group">
        <div class="col-xl-8 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">account_tree</mat-icon>
                Category
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label required" for="category_id">Code</label>
                    <input type="text" id="category_id" formControlName="category_id" class="form-control text-uppercase" placeholder="CAT-001" />
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="field-group">
                    <label class="field-label required" for="category_name">Name</label>
                    <input type="text" id="category_name" formControlName="category_name" class="form-control" placeholder="e.g. Beverages" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label" for="parent_category_no">Parent Category</label>
                    <ng-select id="parent_category_no" labelForId="parent_category_no" formControlName="parent_category_no" [clearable]="true" placeholder="None (root)">
                      @for (p of model.availableParents(); track p.value) {
                        <ng-option [value]="p.value">{{ p.label }}</ng-option>
                      }
                    </ng-select>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label" for="default_vat_tax_no">Default Tax</label>
                    <ng-select id="default_vat_tax_no" labelForId="default_vat_tax_no" formControlName="default_vat_tax_no" [clearable]="true" placeholder="None">
                      @for (t of model.taxOptions(); track t.value) {
                        <ng-option [value]="t.value">{{ t.label }}</ng-option>
                      }
                    </ng-select>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="category_name_nls">Name (NLS)</label>
                    <input type="text" id="category_name_nls" formControlName="category_name_nls" class="form-control" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="order_sl">Order</label>
                    <input type="number" id="order_sl" formControlName="order_sl" class="form-control" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="is_active">Status</label>
                    <ng-select id="is_active" labelForId="is_active" formControlName="is_active" [clearable]="false">
                      <ng-option [value]="1">Active</ng-option>
                      <ng-option [value]="0">Inactive</ng-option>
                    </ng-select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
