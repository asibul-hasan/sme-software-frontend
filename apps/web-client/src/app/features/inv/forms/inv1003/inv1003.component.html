<app-page-form-layout
  [title]="'Category Setup'"
  [icon]="'account_tree'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Categories'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (c of model.pager.paged(); track c.category_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === c.category_no"
        (click)="model.select(c)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="c.is_active === 1"
          [class.status-dot--inactive]="c.is_active !== 1"
          [matTooltip]="c.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 truncate">{{ c.category_name }}</h6>
        <p class="list-item-subtitle mb-0 truncate">{{ c.category_id }}@if (c.parent_category_name) { · under {{ c.parent_category_name }} }</p>
        <div class="list-item-meta">
          <span class="list-item-tag">Level {{ c.depth ?? 0 }}</span>
        </div>
      </button>
    }
    @if (model.filtered().length === 0) {
      <div class="list-empty-state">
        <mat-icon>account_tree</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent>
    <form [formGroup]="model.form" autocomplete="off">
      <app-form-section title="Category" icon="account_tree">
        <app-form-field label="Code" for="category_id" required [span]="4">
          <input
            type="text"
            id="category_id"
            formControlName="category_id"
            class="form-control uppercase"
            placeholder="CAT-001"
          />
        </app-form-field>

        <app-form-field label="Name" for="category_name" required [span]="8">
          <input
            type="text"
            id="category_name"
            formControlName="category_name"
            class="form-control"
            placeholder="e.g. Beverages"
          />
        </app-form-field>

        <app-form-field label="Parent Category" for="parent_category_no" [span]="6">
          <ng-select
            id="parent_category_no"
            labelForId="parent_category_no"
            formControlName="parent_category_no"
            [clearable]="true"
            placeholder="None (root)"
          >
            @for (p of model.availableParents(); track p.value) {
              <ng-option [value]="p.value">{{ p.label }}</ng-option>
            }
          </ng-select>
        </app-form-field>

        <app-form-field label="Default Tax" for="default_vat_tax_no" [span]="6">
          <ng-select
            id="default_vat_tax_no"
            labelForId="default_vat_tax_no"
            formControlName="default_vat_tax_no"
            [clearable]="true"
            placeholder="None"
          >
            @for (t of model.taxOptions(); track t.value) {
              <ng-option [value]="t.value">{{ t.label }}</ng-option>
            }
          </ng-select>
        </app-form-field>

        <app-form-field label="Name (NLS)" for="category_name_nls" [span]="4">
          <input
            type="text"
            id="category_name_nls"
            formControlName="category_name_nls"
            class="form-control"
          />
        </app-form-field>

        <app-form-field label="Order" for="order_sl" [span]="4">
          <input
            type="number"
            id="order_sl"
            formControlName="order_sl"
            class="form-control"
          />
        </app-form-field>

        <app-check-field label="Status" text="Active" [span]="4" formControlName="is_active" />
      </app-form-section>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
