<app-page-form-layout
  [title]="'Product Attribute Setup'"
  [icon]="'tune'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Attributes'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (a of model.pager.paged(); track a.attribute_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === a.attribute_no"
        (click)="model.select(a)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="a.is_active === 1"
          [class.status-dot--inactive]="a.is_active !== 1"
          [matTooltip]="a.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 truncate">{{ a.attribute_name }}</h6>
        <p class="list-item-subtitle mb-0 truncate">{{ a.attribute_id }}</p>
        <div class="list-item-meta">
          <span class="list-item-tag">{{ a.values.length }} values</span>
        </div>
      </button>
    }
    @if (model.filtered().length === 0) {
      <div class="list-empty-state">
        <mat-icon>tune</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent class="h-full flex flex-col gap-3">
    <form [formGroup]="model.form" autocomplete="off" class="flex-shrink-0">
      <app-form-section title="Attribute" icon="tune">
        <app-form-field label="Code" for="attribute_id" required [span]="4">
          <input
            type="text"
            id="attribute_id"
            formControlName="attribute_id"
            class="form-control uppercase"
            placeholder="SIZE"
          />
        </app-form-field>

        <app-form-field label="Name" for="attribute_name" required [span]="5">
          <input
            type="text"
            id="attribute_name"
            formControlName="attribute_name"
            class="form-control"
            placeholder="Size"
          />
        </app-form-field>

        <app-check-field label="Status" text="Active" [span]="3" formControlName="is_active" />
      </app-form-section>
    </form>

    <div class="form-section-card card flex-1 min-h-0 flex flex-col" style="min-height: 380px">
      <div class="card-body p-0 flex-1 min-h-0">
        <app-erp-grid
          [config]="valuesGrid"
          [data]="model.valueRows()"
          height="100%"
          (addRow)="model.addValue()"
          (rowChange)="model.onValueChange($event)"
          (rowRemove)="model.removeValue($event)"
        ></app-erp-grid>
      </div>
    </div>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
