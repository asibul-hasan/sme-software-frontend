<app-page-form-layout
  [title]="'Reorder Level Setup'"
  [subtitle]="'Safety stock thresholds, reorder quantities, and procurement lead times'"
  [icon]="'low_priority'"
  [hasSidebar]="false"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="false"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div formContent class="h-full flex flex-col gap-3">
    <!-- Top toolbar: Warehouse selector -->
    <div class="card p-3 flex flex-row items-center justify-between gap-4 flex-shrink-0">
      <div class="flex items-center gap-2">
        <mat-icon class="text-muted">warehouse</mat-icon>
        <span class="font-semibold text-sm">Target Warehouse:</span>
      </div>
      <div style="width: 320px">
        <ng-select
          [items]="model.warehouses()"
          bindValue="value"
          bindLabel="label"
          [clearable]="false"
          placeholder="Select warehouse"
          [ngModel]="model.selectedWarehouseNo()"
          (ngModelChange)="model.selectWarehouse($event)"
        ></ng-select>
      </div>
    </div>

    @if (!model.selectedWarehouseNo()) {
      <div class="card p-8 text-center opacity-75">
        <mat-icon class="text-4xl text-muted mb-2">low_priority</mat-icon>
        <p>Please select a warehouse to manage its reorder policies.</p>
      </div>
    } @else {
      <div class="form-section-card card flex-1 min-h-0 flex flex-col" style="min-height: 420px">
        <div class="card-body p-0 flex-1 min-h-0">
          <app-erp-grid
            [config]="gridConfig"
            [data]="model.rows()"
            height="100%"
            (addRow)="model.addRow()"
            (rowChange)="model.onRowChange($event)"
            (rowRemove)="model.removeRow($event)"
          ></app-erp-grid>
        </div>
      </div>
    }
  </div>
</app-page-form-layout>
