<app-page-form-layout
  [title]="'Unit of Measure Setup'"
  [icon]="'straighten'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Units'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (u of model.pager.paged(); track u.uom_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === u.uom_no"
        (click)="model.select(u)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="u.is_active === 1"
          [class.status-dot--inactive]="u.is_active !== 1"
          [matTooltip]="u.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 truncate" style="padding-right: 16px">{{ u.uom_id }}</h6>
        <p class="list-item-subtitle mb-0 truncate">{{ u.uom_name }}</p>
      </button>
    }
    @if (model.filtered().length === 0) {
      <div class="list-empty-state">
        <mat-icon>straighten</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent>
    <form [formGroup]="model.form" autocomplete="off">
      <app-form-section title="Unit of Measure" icon="straighten">
        <app-form-field label="Code" for="uom_id" required [span]="3">
          <input
            type="text"
            id="uom_id"
            formControlName="uom_id"
            class="form-control uppercase"
            placeholder="PCS"
          />
        </app-form-field>

        <app-form-field label="Name" for="uom_name" required [span]="5">
          <input
            type="text"
            id="uom_name"
            formControlName="uom_name"
            class="form-control"
            placeholder="Pieces"
          />
        </app-form-field>

        <app-form-field label="Name (NLS)" for="uom_name_nls" [span]="4">
          <input
            type="text"
            id="uom_name_nls"
            formControlName="uom_name_nls"
            class="form-control"
          />
        </app-form-field>

        <app-form-field label="Type" for="uom_type" required [span]="5">
          <ng-select
            id="uom_type"
            labelForId="uom_type"
            formControlName="uom_type"
            [clearable]="false"
          >
            @for (t of model.uomTypes; track t.value) {
              <ng-option [value]="t.value">{{ t.label }}</ng-option>
            }
          </ng-select>
        </app-form-field>

        <app-form-field label="Decimals" for="decimal_places" required [span]="3">
          <input
            type="number"
            id="decimal_places"
            formControlName="decimal_places"
            class="form-control"
            min="0"
            max="4"
            step="1"
          />
        </app-form-field>

        <app-check-field label="Status" text="Active" [span]="4" formControlName="is_active" />
      </app-form-section>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
