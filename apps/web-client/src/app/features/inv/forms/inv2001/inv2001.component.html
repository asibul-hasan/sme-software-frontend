<app-page-form-layout
  [title]="'Warehouse Setup'"
  [icon]="'warehouse'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Warehouses'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (w of model.pager.paged(); track w.warehouse_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === w.warehouse_no"
        (click)="model.select(w)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="w.is_active === 1"
          [class.status-dot--inactive]="w.is_active !== 1"
          [matTooltip]="w.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 truncate">{{ w.warehouse_name }}</h6>
        <p class="list-item-subtitle mb-0 truncate">{{ w.warehouse_id }}</p>
        @if (w.is_default === 1) {
          <div class="list-item-meta">
            <span class="list-item-tag list-item-tag--primary">Default</span>
          </div>
        }
      </button>
    }
    @if (model.filtered().length === 0) {
      <div class="list-empty-state">
        <mat-icon>warehouse</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent>
    <form [formGroup]="model.form" autocomplete="off">
      <app-form-section title="Warehouse" icon="warehouse">
        <app-form-field label="Code" for="warehouse_id" required [span]="4">
          <input
            type="text"
            id="warehouse_id"
            formControlName="warehouse_id"
            class="form-control uppercase"
            placeholder="WH-MAIN"
          />
        </app-form-field>

        <app-form-field label="Name" for="warehouse_name" required [span]="8">
          <input
            type="text"
            id="warehouse_name"
            formControlName="warehouse_name"
            class="form-control"
            placeholder="Main Store"
          />
        </app-form-field>

        <app-form-field label="Type" for="warehouse_type" required [span]="6">
          <ng-select
            id="warehouse_type"
            labelForId="warehouse_type"
            formControlName="warehouse_type"
            [clearable]="false"
          >
            @for (t of model.warehouseTypes; track t.value) {
              <ng-option [value]="t.value">{{ t.label }}</ng-option>
            }
          </ng-select>
        </app-form-field>

        <app-form-field label="Manager (Employee No)" for="manager_employee_no" [span]="6">
          <input
            type="number"
            id="manager_employee_no"
            formControlName="manager_employee_no"
            class="form-control"
            placeholder="Optional"
          />
        </app-form-field>

        <app-form-field label="Address" for="address" [span]="12">
          <input
            type="text"
            id="address"
            formControlName="address"
            class="form-control"
          />
        </app-form-field>

        <app-check-field label="Default" text="Default Warehouse" [span]="3" formControlName="is_default" />
        <app-check-field label="Negative Stock" text="Allow Negative" [span]="3" formControlName="allow_negative_stock" />
        <app-check-field label="Sale Point" text="Is Sale Point" [span]="3" formControlName="is_sale_point" />
        <app-check-field label="Status" text="Active" [span]="3" formControlName="is_active" />
      </app-form-section>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
