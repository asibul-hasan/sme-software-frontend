<app-page-form-layout
  [title]="'Brand Setup'"
  [icon]="'sell'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Brands'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (b of model.pager.paged(); track b.brand_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === b.brand_no"
        (click)="model.select(b)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="b.is_active === 1"
          [class.status-dot--inactive]="b.is_active !== 1"
          [matTooltip]="b.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 truncate" style="padding-right: 16px">{{ b.brand_id }}</h6>
        <p class="list-item-subtitle mb-0 truncate">{{ b.brand_name }}</p>
      </button>
    }
    @if (model.filtered().length === 0) {
      <div class="list-empty-state">
        <mat-icon>sell</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent>
    <form [formGroup]="model.form" autocomplete="off">
      <app-form-section title="Brand" icon="sell">
        <app-form-field label="Code" for="brand_id" required [span]="4">
          <input
            type="text"
            id="brand_id"
            formControlName="brand_id"
            class="form-control uppercase"
            placeholder="e.g. BR-001"
          />
        </app-form-field>

        <app-form-field label="Name" for="brand_name" required [span]="8">
          <input
            type="text"
            id="brand_name"
            formControlName="brand_name"
            class="form-control"
            placeholder="e.g. Nestlé"
          />
        </app-form-field>

        <app-form-field label="Manufacturer" for="manufacturer" [span]="6">
          <input
            type="text"
            id="manufacturer"
            formControlName="manufacturer"
            class="form-control"
          />
        </app-form-field>

        <app-form-field label="Name (NLS)" for="brand_name_nls" [span]="6">
          <input
            type="text"
            id="brand_name_nls"
            formControlName="brand_name_nls"
            class="form-control"
          />
        </app-form-field>

        <app-check-field label="Status" text="Active" [span]="6" formControlName="is_active" />
      </app-form-section>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
