<app-page-form-layout
  [title]="'Supplier Management'"
  [subtitle]="'Vendor master — terms, tax IDs, banking; payable is derived from the AP ledger'"
  [icon]="'local_shipping'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Suppliers'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  [pager]="model.pager"
  (save)="onSave()" (new)="onNew()" (reset)="onReset()" (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()" [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (item of model.pager.paged(); track item.supplier_no) {
      <button type="button" class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === item.supplier_no" (click)="select(item)">
        <span class="status-dot status-dot--corner" [class.status-dot--active]="item.is_active === 1" [class.status-dot--inactive]="item.is_active !== 1"
          [title]="item.is_active === 1 ? 'Active' : 'Inactive'"></span>
        <h6 class="list-item-title mb-0 text-truncate" style="padding-right: 16px">{{ item.supplier_name }}</h6>
        <p class="list-item-subtitle mb-0 text-truncate">{{ item.supplier_id }}{{ item.mobile_no ? ' · ' + item.mobile_no : '' }}</p>
        <div class="list-item-meta">
          <span class="list-item-tag">{{ typeLabel(item.supplier_type) }}</span>
          @if (item.current_payable && item.current_payable > 0) { <span class="list-item-value">{{ item.current_payable | number: '1.0-0' }}</span> }
        </div>
      </button>
    }
    @if (model.filtered().length === 0) { <div class="list-empty-state"><mat-icon>local_shipping</mat-icon><p>No suppliers found</p></div> }
  </div>

  <div formContent>
    <form [formGroup]="formdata" autocomplete="off">
      <div class="row row-group">
        <!-- Identity -->
        <div class="col-lg-8">
          <div class="form-section-card card">
            <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">badge</mat-icon> Identity</h4></div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-3"><div class="field-group"><label class="field-label" for="supplier_id">Supplier ID</label>
                  <input type="text" id="supplier_id" formControlName="supplier_id" class="form-control" placeholder="auto (SUP-…)" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label required" for="supplier_name">Supplier Name</label>
                  <input type="text" id="supplier_name" formControlName="supplier_name" class="form-control" /></div></div>
                <div class="col-md-3"><div class="field-group"><label class="field-label required" for="supplier_type">Type</label>
                  <ng-select id="supplier_type" formControlName="supplier_type" [items]="supplierTypes" bindValue="value" bindLabel="label" [clearable]="false" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="contact_person">Contact Person</label>
                  <input type="text" id="contact_person" formControlName="contact_person" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="mobile_no">Mobile</label>
                  <input type="text" id="mobile_no" formControlName="mobile_no" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="alt_mobile_no">Alt Mobile</label>
                  <input type="text" id="alt_mobile_no" formControlName="alt_mobile_no" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="phone_no">Phone</label>
                  <input type="text" id="phone_no" formControlName="phone_no" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="email">Email</label>
                  <input type="email" id="email" formControlName="email" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="website">Website</label>
                  <input type="text" id="website" formControlName="website" class="form-control" /></div></div>
              </div>
            </div>
          </div>

          <!-- Address -->
          <div class="form-section-card card">
            <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">place</mat-icon> Address</h4></div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="address_line1">Address Line 1</label>
                  <input type="text" id="address_line1" formControlName="address_line1" class="form-control" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="address_line2">Address Line 2</label>
                  <input type="text" id="address_line2" formControlName="address_line2" class="form-control" /></div></div>
                <div class="col-md-3"><div class="field-group"><label class="field-label" for="city">City</label>
                  <input type="text" id="city" formControlName="city" class="form-control" /></div></div>
                <div class="col-md-3"><div class="field-group"><label class="field-label" for="state_province">State / Province</label>
                  <input type="text" id="state_province" formControlName="state_province" class="form-control" /></div></div>
                <div class="col-md-3"><div class="field-group"><label class="field-label" for="post_code">Post Code</label>
                  <input type="text" id="post_code" formControlName="post_code" class="form-control" /></div></div>
                <div class="col-md-3"><div class="field-group"><label class="field-label" for="country_code">Country</label>
                  <input type="text" id="country_code" formControlName="country_code" class="form-control" /></div></div>
              </div>
            </div>
          </div>

          <!-- Banking -->
          <div class="form-section-card card">
            <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">account_balance</mat-icon> Banking</h4></div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="bank_name">Bank Name</label>
                  <input type="text" id="bank_name" formControlName="bank_name" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="bank_account_no">Bank Account No</label>
                  <input type="text" id="bank_account_no" formControlName="bank_account_no" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="bank_branch">Bank Branch</label>
                  <input type="text" id="bank_branch" formControlName="bank_branch" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="routing_no">Routing No</label>
                  <input type="text" id="routing_no" formControlName="routing_no" class="form-control" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="mfs_provider">MFS Provider</label>
                  <input type="text" id="mfs_provider" formControlName="mfs_provider" class="form-control" placeholder="bKash / Nagad…" /></div></div>
                <div class="col-md-4"><div class="field-group"><label class="field-label" for="mfs_number">MFS Number</label>
                  <input type="text" id="mfs_number" formControlName="mfs_number" class="form-control" /></div></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right column: Terms + Tax + Status -->
        <div class="col-lg-4">
          <div class="form-section-card card">
            <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">payments</mat-icon> Terms</h4></div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="payment_terms">Payment Terms</label>
                  <ng-select id="payment_terms" formControlName="payment_terms" [items]="paymentTerms" bindValue="value" bindLabel="label" [clearable]="false" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="credit_days">Credit Days</label>
                  <input type="number" id="credit_days" formControlName="credit_days" class="form-control" /></div></div>
                <div class="col-md-12"><div class="field-group"><label class="field-label" for="credit_limit">Credit Limit</label>
                  <input type="number" id="credit_limit" formControlName="credit_limit" class="form-control" step="0.01" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="opening_balance">Opening Payable</label>
                  <input type="number" id="opening_balance" formControlName="opening_balance" class="form-control" step="0.01" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="opening_balance_date">As of</label>
                  <input type="date" id="opening_balance_date" formControlName="opening_balance_date" class="form-control" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="lead_time_days">Lead Time (days)</label>
                  <input type="number" id="lead_time_days" formControlName="lead_time_days" class="form-control" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="rating">Rating</label>
                  <input type="number" id="rating" formControlName="rating" class="form-control" min="1" max="5" /></div></div>
              </div>
            </div>
          </div>

          <div class="form-section-card card">
            <div class="card-header"><h4 class="card-header__title mb-0 fw-bold"><mat-icon class="me-2 align-middle">receipt_long</mat-icon> Tax & Status</h4></div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="vat_reg_no">VAT Reg No</label>
                  <input type="text" id="vat_reg_no" formControlName="vat_reg_no" class="form-control" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="tin_no">TIN</label>
                  <input type="text" id="tin_no" formControlName="tin_no" class="form-control" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="bin_no">BIN</label>
                  <input type="text" id="bin_no" formControlName="bin_no" class="form-control" /></div></div>
                <div class="col-md-6"><div class="field-group"><label class="field-label" for="trade_license_no">Trade License</label>
                  <input type="text" id="trade_license_no" formControlName="trade_license_no" class="form-control" /></div></div>
                <div class="col-md-12"><div class="field-group"><label class="field-label">Status</label>
                  <div class="custom--checkbox"><mat-checkbox color="primary" [checked]="formdata.get('is_active')?.value === 1" (change)="formdata.get('is_active')?.setValue($event.checked ? 1 : 0)"><span class="field-label mb-0" style="cursor:pointer">Active</span></mat-checkbox></div>
                </div></div>
                <div class="col-md-12"><div class="field-group"><label class="field-label" for="remarks">Remarks</label>
                  <textarea id="remarks" formControlName="remarks" class="form-control" rows="2"></textarea></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
