<app-page-form-layout
  [title]="'Supplier Price List'"
  [subtitle]="'Per-supplier product price, MOQ, lead time, and supplier SKU'"
  [icon]="'price_change'"
  [recordsCount]="rows().length"
  [sidebarTitle]="'Suppliers'"
  [searchTerm]="searchTerm()"
  (searchTermChange)="searchTerm.set($event); pager.reset()"
  [pager]="pager"
  (save)="save()"
  (reset)="selectedSupplierNo() ? loadRows(selectedSupplierNo()!) : null"
  [showSave]="canEdit()"
  [showNew]="false"
  [showDelete]="false"
  [isSaving]="isSaving()"
  [isLoading]="isLoading()"
>
  <div sidebarList>
    @for (supplier of pager.paged(); track supplier.no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="selectedSupplierNo() === supplier.no"
        (click)="selectSupplier(supplier)"
      >
        <span class="status-dot status-dot--corner status-dot--active" title="Active"></span>
        <h6 class="list-item-title mb-0 text-truncate" style="padding-right: 16px">{{ supplier.name }}</h6>
        <p class="list-item-subtitle mb-0 text-truncate">{{ supplier.code }}</p>
        <div class="list-item-meta">
          <span class="list-item-chip"><mat-icon>local_shipping</mat-icon><span>Supplier</span></span>
        </div>
      </button>
    }
    @if (filteredSuppliers().length === 0) {
      <div class="list-empty-state"><mat-icon>local_shipping</mat-icon><p>No suppliers found</p></div>
    }
  </div>

  <div formContent class="h-full flex flex-col">
    <div class="form-section-card card">
      <div class="card-header">
        <h4 class="card-header__title mb-0 fw-bold">
          <mat-icon class="me-2 align-middle">add_shopping_cart</mat-icon>
          Add Price Row
        </h4>
      </div>
      <div class="card-body">
        <div class="row row-group">
          <div class="col-lg-3 col-md-6">
            <div class="field-group">
              <label class="field-label required">Product</label>
              <ng-select [(ngModel)]="newProductNo" [items]="products()" bindValue="no" bindLabel="name" [disabled]="!canEdit()" />
            </div>
          </div>
          <div class="col-lg-2 col-md-6">
            <div class="field-group">
              <label class="field-label required">UOM</label>
              <ng-select [(ngModel)]="newUomNo" [items]="uoms()" bindValue="no" bindLabel="name" [disabled]="!canEdit()" />
            </div>
          </div>
          <div class="col-lg-2 col-md-6">
            <div class="field-group">
              <label class="field-label">Supplier SKU</label>
              <input type="text" class="form-control" [(ngModel)]="newSku" [disabled]="!canEdit()" />
            </div>
          </div>
          <div class="col-lg-2 col-md-6">
            <div class="field-group">
              <label class="field-label required">Last Price</label>
              <input type="number" class="form-control" [(ngModel)]="newPrice" min="0" step="0.01" inputmode="decimal" [disabled]="!canEdit()" />
            </div>
          </div>
          <div class="col-lg-1 col-md-4">
            <div class="field-group">
              <label class="field-label">Disc %</label>
              <input type="number" class="form-control" [(ngModel)]="newDiscountPct" min="0" step="0.01" [disabled]="!canEdit()" />
            </div>
          </div>
          <div class="col-lg-1 col-md-4">
            <div class="field-group">
              <label class="field-label">MOQ</label>
              <input type="number" class="form-control" [(ngModel)]="newMoq" min="0" step="0.01" [disabled]="!canEdit()" />
            </div>
          </div>
          <div class="col-lg-1 col-md-4">
            <div class="field-group">
              <label class="field-label">Lead</label>
              <input type="number" class="form-control" [(ngModel)]="newLeadTimeDays" min="0" [disabled]="!canEdit()" />
            </div>
          </div>
          <div class="col-lg-2 col-md-6">
            <div class="field-group">
              <label class="field-label">Preferred</label>
              <div class="custom--checkbox">
                <mat-checkbox color="primary" [(ngModel)]="newPreferred" [disabled]="!canEdit()">
                  <span class="field-label mb-0" style="cursor: pointer">Preferred</span>
                </mat-checkbox>
              </div>
            </div>
          </div>
          <div class="col-lg-2 col-md-6 d-flex align-items-end gap-2">
            <button type="button" class="btn btn-primary w-100" (click)="addRow()" [disabled]="!canEdit()">
              <mat-icon class="me-1 align-middle">add</mat-icon>
              Add Row
            </button>
            <button type="button" class="btn btn-outline-danger" (click)="clearAll()" [disabled]="!canEdit() || rows().length === 0">
              <mat-icon class="align-middle">clear_all</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section-card card fill-card">
      <div class="card-header">
        <h4 class="card-header__title mb-0 fw-bold">
          <mat-icon class="me-2 align-middle">price_change</mat-icon>
          Price List Rows
        </h4>
      </div>
      <div class="card-body p-0">
        <app-common-table
          [columns]="tableColumns"
          [data]="tableData()"
          [config]="tableConfig"
        />
      </div>
    </div>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="pager"></app-sidebar-pagination>
</app-page-form-layout>
