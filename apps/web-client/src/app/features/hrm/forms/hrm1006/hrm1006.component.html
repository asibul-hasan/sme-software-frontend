<app-page-form-layout
  [title]="'Holiday Calendar'"
  [subtitle]="'Define public, religious and company holidays'"
  [icon]="'event'"
  [recordsCount]="model.filtered().length"
  [sidebarTitle]="'Holidays'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  [sortDirection]="model.sortDirection()"
  (sortDirectionChange)="model.sortDirection.set($event); model.pager.reset()"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (item of model.pager.paged(); track item.holiday_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedNo() === item.holiday_no"
        (click)="selectHoliday(item)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="item.is_active === 1"
          [class.status-dot--inactive]="item.is_active !== 1"
          [title]="item.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 text-truncate" style="padding-right: 16px">{{ item.holiday_date }}</h6>
        <p class="list-item-subtitle mb-0 text-truncate">{{ item.holiday_name }}</p>
        <div class="list-item-meta">
          <span class="list-item-tag" [class.list-item-tag--primary]="item.holiday_type === 1">{{ typeLabel(item.holiday_type) }}</span>
          @if (item.is_recurring === 1) {
            <span class="list-item-tag">Recurring</span>
          }
        </div>
      </button>
    }
    @if (model.filtered().length === 0) {
      <div class="list-empty-state">
        <mat-icon>event</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent>
    <form [formGroup]="formdata" autocomplete="off">
      <div class="row row-group">
        <div class="col-xl-8 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">info</mat-icon>
                Holiday Information
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label required" for="holiday_date">Date</label>
                    <input type="date" id="holiday_date" formControlName="holiday_date" class="form-control" />
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="field-group">
                    <label class="field-label required" for="holiday_name">Holiday Name</label>
                    <input type="text" id="holiday_name" formControlName="holiday_name" class="form-control" placeholder="e.g. Independence Day" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label required" for="holiday_type">Type</label>
                    <ng-select id="holiday_type" labelForId="holiday_type" formControlName="holiday_type" [clearable]="false" placeholder="Select type">
                      @for (opt of holidayTypes; track opt.value) {
                        <ng-option [value]="opt.value">{{ opt.label }}</ng-option>
                      }
                    </ng-select>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label" for="leave_year">Leave Year</label>
                    <input type="number" id="leave_year" formControlName="leave_year" class="form-control" step="1" placeholder="e.g. 2026" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-xl-4 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">settings</mat-icon>
                Rules & Status
              </h4>
            </div>
            <div class="card-body">
              <div class="field-group mb-3">
                <label class="field-label">Recurring</label>
                <div class="custom--checkbox">
                  <mat-checkbox [checked]="formdata.get('is_recurring')?.value === 1" (change)="toggleFlag('is_recurring', $event)" color="primary">
                    <span class="field-label mb-0" style="cursor: pointer">Repeats every year</span>
                  </mat-checkbox>
                </div>
              </div>
              <div class="field-group mb-3">
                <label class="field-label" for="remarks">Remarks</label>
                <textarea id="remarks" formControlName="remarks" class="form-control" rows="2"></textarea>
              </div>
              <div class="field-group">
                <label class="field-label">Status</label>
                <div class="custom--checkbox">
                  <mat-checkbox [checked]="formdata.get('is_active')?.value === 1" (change)="toggleFlag('is_active', $event)" color="primary">
                    <span class="field-label mb-0" style="cursor: pointer">Active</span>
                  </mat-checkbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
