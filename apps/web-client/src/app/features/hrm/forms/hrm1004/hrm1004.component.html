<app-page-form-layout
  [title]="'Grade / Pay-Scale Setup'"
  [subtitle]="'Define pay grades, salary bands and overtime eligibility'"
  [icon]="'workspace_premium'"
  [recordsCount]="model.filteredGrades().length"
  [sidebarTitle]="'Grades'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  [sortDirection]="model.sortDirection()"
  (sortDirectionChange)="model.sortDirection.set($event); model.pager.reset()"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedGradeNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <!-- Sidebar List -->
  <div sidebarList>
    @for (grade of model.pager.paged(); track grade.grade_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedGradeNo() === grade.grade_no"
        (click)="selectGrade(grade)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="grade.is_active === 1"
          [class.status-dot--inactive]="grade.is_active !== 1"
          [title]="grade.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 text-truncate" style="padding-right: 16px">{{ grade.grade_id }}</h6>
        <p class="list-item-subtitle mb-0 text-truncate">{{ grade.grade_name }}</p>
        <div class="list-item-meta">
          @if (grade.rank_order != null) {
            <span class="list-item-tag">Rank {{ grade.rank_order }}</span>
          }
          @if (grade.is_overtime_eligible === 1) {
            <span class="list-item-tag list-item-tag--primary">OT</span>
          }
        </div>
      </button>
    }

    @if (model.filteredGrades().length === 0) {
      <div class="list-empty-state">
        <mat-icon>workspace_premium</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <!-- Main Form Content -->
  <div formContent>
    <form [formGroup]="formdata" autocomplete="off">
      <div class="row row-group">
        <!-- Grade Info (8-col) -->
        <div class="col-xl-8 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">info</mat-icon>
                Grade Information
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label required" for="grade_id">Grade Code</label>
                    <input
                      type="text"
                      id="grade_id"
                      formControlName="grade_id"
                      class="form-control text-uppercase"
                      placeholder="e.g. G-5"
                      (input)="toUpper('grade_id')"
                    />
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="field-group">
                    <label class="field-label required" for="grade_name">Grade Name</label>
                    <input
                      type="text"
                      id="grade_name"
                      formControlName="grade_name"
                      class="form-control"
                      placeholder="e.g. Senior Officer"
                    />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="rank_order">Rank Order</label>
                    <input
                      type="number"
                      id="rank_order"
                      formControlName="rank_order"
                      class="form-control"
                      placeholder="1 = highest"
                      step="1"
                    />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="min_salary">Minimum Salary</label>
                    <input
                      type="number"
                      id="min_salary"
                      formControlName="min_salary"
                      class="form-control"
                      step="0.01"
                    />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="max_salary">Maximum Salary</label>
                    <input
                      type="number"
                      id="max_salary"
                      formControlName="max_salary"
                      class="form-control"
                      step="0.01"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column (4-col) -->
        <div class="col-xl-4 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">settings</mat-icon>
                Rules & Status
              </h4>
            </div>
            <div class="card-body">
              <div class="field-group mb-3">
                <label class="field-label">Overtime Eligible</label>
                <div class="custom--checkbox">
                  <mat-checkbox
                    [checked]="formdata.get('is_overtime_eligible')?.value === 1"
                    (change)="toggleOvertime($event)"
                    color="primary"
                  >
                    <span class="field-label mb-0" style="cursor: pointer">Eligible for overtime</span>
                  </mat-checkbox>
                </div>
              </div>
              <div class="field-group mb-3">
                <label class="field-label" for="remarks">Remarks</label>
                <textarea
                  id="remarks"
                  formControlName="remarks"
                  class="form-control"
                  rows="2"
                ></textarea>
              </div>
              <div class="field-group">
                <label class="field-label">Status</label>
                <div class="custom--checkbox">
                  <mat-checkbox
                    [checked]="formdata.get('is_active')?.value === 1"
                    (change)="toggleActive($event)"
                    color="primary"
                  >
                    <span class="field-label mb-0" style="cursor: pointer">Active</span>
                  </mat-checkbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Pagination footer -->
  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
