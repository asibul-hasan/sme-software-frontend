<app-page-form-layout
  [title]="'Leave Type Setup'"
  [subtitle]="'Manage and configure leave types globally'"
  [icon]="'time_to_leave'"
  [hasSidebar]="false"
  (reset)="onReset()"
  (save)="save()"
  (new)="addLine()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="false"
  [isLoading]="isLoading()"
  [isSaving]="isSaving()"
>
  <div formContent class="h-100 flex flex-col gap-3 overflow-hidden">
    <div class="form-section-card card m-0 flex-1 min-h-0 flex flex-col overflow-hidden">
      <div class="card-header d-flex align-items-center gap-2 flex-wrap flex-shrink-0">
        <h4 class="card-header__title mb-0 fw-bold">
          <mat-icon class="me-2 align-middle">list_alt</mat-icon>
          Leave Types
        </h4>

        <div class="ms-auto d-flex align-items-center gap-2">
          <button type="button" class="btn-action btn-new" (click)="addLine()">
            <mat-icon>add</mat-icon>
            <span class="btn-action-label">Add Row</span>
          </button>
        </div>
      </div>

      <div class="card-body p-0 flex-1 min-h-0 flex flex-col overflow-hidden">
        <app-common-table
          [columns]="columns()"
          [data]="tableData()"
          [config]="config"
          (rowClick)="onRowClick($event)"
          class="h-100 flex-1"
        />
      </div>
    </div>

    @if (selectedLeaveTypeNo()) {
      <div class="form-section-card card m-0 flex-1 min-h-0 flex flex-col overflow-hidden">
        <div class="card-header d-flex align-items-center gap-2 flex-wrap flex-shrink-0">
          <h4 class="card-header__title mb-0 fw-bold">
            <mat-icon class="me-2 align-middle">settings_applications</mat-icon>
            Policies for: <span class="text-primary">{{ selectedLeaveTypeName() }}</span>
          </h4>
          <button type="button" class="btn-action btn-new ms-2" (click)="addPolicyLine()">
            <mat-icon>add</mat-icon>
            <span class="btn-action-label">Add Row</span>
          </button>
        </div>

        <div class="card-body p-0 position-relative flex-1 min-h-0 flex flex-col overflow-hidden">
          @if (isPolicyLoading()) {
            <div class="position-absolute w-100 h-100 d-flex justify-content-center align-items-center bg-white" style="z-index: 10; opacity: 0.7;">
              <div class="spinner-border text-primary" role="status"></div>
            </div>
          }
          <app-common-table
            #policyTable
            [columns]="policyColumns()"
            [data]="policyTableData()"
            [config]="policyConfig"
            class="h-100 flex-1"
          />
        </div>
      </div>
    }
  </div>
</app-page-form-layout>
