<app-page-form-layout
  [title]="'Shift Setup'"
  [subtitle]="'Define work shifts, grace time, breaks and weekly off'"
  [icon]="'schedule'"
  [recordsCount]="model.filteredShifts().length"
  [sidebarTitle]="'Shifts'"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  [sortDirection]="model.sortDirection()"
  (sortDirectionChange)="model.sortDirection.set($event); model.pager.reset()"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="permissionService.canDelete() && !!model.selectedShiftNo()"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div sidebarList>
    @for (shift of model.pager.paged(); track shift.shift_no) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        [class.active]="model.selectedShiftNo() === shift.shift_no"
        (click)="selectShift(shift)"
      >
        <span
          class="status-dot status-dot--corner"
          [class.status-dot--active]="shift.is_active === 1"
          [class.status-dot--inactive]="shift.is_active !== 1"
          [title]="shift.is_active === 1 ? 'Active' : 'Inactive'"
        ></span>
        <h6 class="list-item-title mb-0 text-truncate" style="padding-right: 16px">{{ shift.shift_id }}</h6>
        <p class="list-item-subtitle mb-0 text-truncate">{{ shift.shift_name }}</p>
        <div class="list-item-meta">
          <span class="list-item-tag">{{ (shift.start_time || '').slice(0, 5) }}–{{ (shift.end_time || '').slice(0, 5) }}</span>
        </div>
      </button>
    }
    @if (model.filteredShifts().length === 0) {
      <div class="list-empty-state">
        <mat-icon>schedule</mat-icon>
        <p>No records found</p>
      </div>
    }
  </div>

  <div formContent>
    <form [formGroup]="formdata" autocomplete="off">
      <div class="row row-group">
        <div class="col-xl-8 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">info</mat-icon>
                Shift Information
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="shift_id">Shift Code</label>
                    <input type="text" id="shift_id" formControlName="shift_id" class="form-control text-uppercase" placeholder="e.g. DAY" (input)="toUpper('shift_id')" />
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="field-group">
                    <label class="field-label required" for="shift_name">Shift Name</label>
                    <input type="text" id="shift_name" formControlName="shift_name" class="form-control" placeholder="e.g. General Day Shift" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="effective_date">Effective Date</label>
                    <app-date-picker formControlName="effective_date" placeholder="Select date" />
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="field-group">
                    <label class="field-label required" for="start_time">Start Time</label>
                    <input type="time" id="start_time" formControlName="start_time" class="form-control" />
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="field-group">
                    <label class="field-label required" for="end_time">End Time</label>
                    <input type="time" id="end_time" formControlName="end_time" class="form-control" />
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="field-group">
                    <label class="field-label" for="grace_minutes">Grace (min)</label>
                    <input type="number" id="grace_minutes" formControlName="grace_minutes" class="form-control" step="1" />
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="field-group">
                    <label class="field-label" for="break_minutes">Break (min)</label>
                    <input type="number" id="break_minutes" formControlName="break_minutes" class="form-control" step="1" />
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="field-group">
                    <label class="field-label" for="half_day_minutes">Half-day (min)</label>
                    <input type="number" id="half_day_minutes" formControlName="half_day_minutes" class="form-control" step="1" />
                  </div>
                </div>
                <div class="col-12">
                  <div class="field-group">
                    <label class="field-label">Weekly Off</label>
                    <div class="d-flex flex-wrap gap-1">
                      @for (day of weekDays; track day.bit) {
                        <button type="button" class="form-tab-btn" [class.active]="isOffDay(day.bit)" (click)="toggleOffDay(day.bit)">{{ day.label }}</button>
                      }
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-xl-4 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">settings</mat-icon>
                Rules & Status
              </h4>
            </div>
            <div class="card-body">
              <div class="field-group mb-3">
                <label class="field-label" for="remarks">Remarks</label>
                <textarea id="remarks" formControlName="remarks" class="form-control" rows="2"></textarea>
              </div>
              <div class="field-group">
                <label class="field-label">Status</label>
                <div class="custom--checkbox">
                  <mat-checkbox [checked]="formdata.get('is_active')?.value === 1" (change)="toggleActive($event)" color="primary">
                    <span class="field-label mb-0" style="cursor: pointer">Active</span>
                  </mat-checkbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <app-sidebar-pagination sidebarFooter [pager]="model.pager"></app-sidebar-pagination>
</app-page-form-layout>
