<app-page-form-layout [title]="'fySetup' | translate" [subtitle]="'manageFySettings' | translate"
  [icon]="'calendar_today'" [hasSidebar]="false" (save)="onSave()" (new)="onNew()" (reset)="onReset()"
  (delete)="onDelete()" [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()" [showDelete]="permissionService.canDelete() && !!model.selectedYearNo()"
  [isSaving]="model.isSaving()" [isLoading]="model.isLoading()">
  <!-- Extra Header Action for Closing FY -->
  <div extraHeaderActions>
    @if (permissionService.canUpdate() && model.selectedYearNo() && formdata.get('is_closed')?.value === 0) {
    <button type="button"
      class="btn btn-sm btn-outline-warning d-flex align-items-center gap-2 py-1 px-3 fw-bold rounded-3"
      (click)="onCloseFY()">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px">lock_open</mat-icon>
      <span class="small">{{ 'closeFy' | translate }}</span>
    </button>
    }
  </div>


  <!-- Main Form Content -->
  <div formContent>
    <form [formGroup]="formdata" autocomplete="off">
      <div class="row row-group">
        <!-- Filter Card -->
        <div class="col-12">
          <div class="form-section-card card">
            <div class="card-body">
              <div class="row">
                <div class="col-md-4 col-sm-6 col-12">
                  <div class="field-group mb-0">
                    <ng-select id="filter_fin_year" [items]="model.financialYears()" bindLabel="fin_year_id"
                      bindValue="fin_year_no" [ngModel]="model.selectedYearNo()" [ngModelOptions]="{standalone: true}"
                      (ngModelChange)="onSelectYear($event)" [clearable]="false" placeholder="Select Financial Year">
                    </ng-select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- FY Basic Info Column (8-col) -->
        <div class="col-xl-12 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold d-flex align-items-center">
                <mat-icon class="me-2 align-middle">info</mat-icon>
                {{ 'fyInfo' | translate }}
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label" for="fin_year_id">{{
                      'fyCode' | translate
                      }}</label>
                    <input type="text" id="fin_year_id" formControlName="fin_year_id"
                      class="form-control text-uppercase" [class.bg-light]="!!model.selectedYearNo()"
                      [readonly]="!!model.selectedYearNo()" placeholder="e.g. FY-JUL25-JUN26" />
                  </div>
                </div>

                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label required" for="start_date">{{
                      'startDate' | translate
                      }}</label>
                    <input type="date" id="start_date" formControlName="start_date" class="form-control"
                      (change)="autoGeneratePeriods()" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label required" for="end_date">{{
                      'endDate' | translate
                      }}</label>
                    <input type="date" id="end_date" formControlName="end_date" class="form-control"
                      (change)="autoGeneratePeriods()" />
                  </div>
                </div>
                <div class="field-group">
                  <label class="field-label" for="is_closed">{{ 'status' | translate }}</label>
                  <ng-select id="is_closed" labelForId="is_closed" formControlName="is_closed" bindLabel="label"
                    bindValue="value" placeholder="{{ 'selectStatus' | translate }}">
                    <ng-option [value]="0">Open</ng-option>
                    <ng-option [value]="1">Closed</ng-option>
                  </ng-select>
                </div>
                <div class="field-group mt-3">
                  <label class="field-label" for="remarks">{{ 'remarks' | translate }}</label>
                  <textarea id="remarks" formControlName="remarks" class="form-control" rows="3"
                    placeholder="Optional remarks"></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>


        <!-- Financial Periods Table (using Custom HTML Table) -->
        <div class="col-12">
          <div class="form-section-card card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h4 class="card-header__title mb-0 fw-bold d-flex align-items-center">
                <mat-icon class="me-2">list_alt</mat-icon>
                {{ 'accountingPeriods' | translate }}
              </h4>
              <button type="button" class="btn btn-sm btn-outline-primary" (click)="autoGeneratePeriods()"
                [disabled]="!formdata.get('start_date')?.value">
                <mat-icon class="align-middle me-1"
                  style="font-size: 16px; width: 16px; height: 16px">auto_fix_high</mat-icon>
                {{ 'regenerate' | translate }}
              </button>
            </div>
            <div class="card-body p-0">
              <app-common-table [columns]="periodsTableColumns" [data]="periodsTableData()"
                [config]="periodsTableConfig" [tableId]="'sys1003-periods'" (cellEdit)="onCellEdit($event)">
              </app-common-table>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</app-page-form-layout>
