<div class="page-card d-flex flex-column" style="overflow: hidden">
  <!-- ── CARD HEADER ─────────────────────── -->
  <div
    class="page-card-header d-flex flex-column flex-md-row justify-content-between p-3 border-bottom flex-shrink-0"
    style="background: var(--card-bg); min-height: 80px"
  >
    <div class="d-flex align-items-center gap-3">
      <div class="header-icon-box shadow-sm">
        <mat-icon>calendar_today</mat-icon>
      </div>
      <div>
        <h2 class="page-card-title m-0 fw-bolder gradient-text-header">
          Financial Year Setup
        </h2>
        <p class="text-secondary m-0 small mt-1">
          Configure accounting periods and fiscal cycles
        </p>
      </div>
    </div>

    <div class="btn-action-group mt-3 mt-md-0 d-flex gap-2">
      <button
        class="btn-action btn-save"
        (click)="onSave()"
        matTooltip="Save (Ctrl+S)"
      >
        <mat-icon>done_all</mat-icon>
        <span class="btn-action-label">Save</span>
      </button>
      <button
        class="btn-action btn-new"
        (click)="onNew()"
        matTooltip="New (Ctrl+N)"
      >
        <mat-icon>add</mat-icon>
        <span class="btn-action-label">New</span>
      </button>
      <button
        class="btn-action btn-reset"
        (click)="onReset()"
        matTooltip="Reset"
      >
        <mat-icon>refresh</mat-icon>
        <span class="btn-action-label">Reset</span>
      </button>
    </div>
  </div>

  <!-- ── SPLIT BODY ──────────────────── -->
  <div class="row g-0 flex-grow-1" style="overflow: hidden; height: 100%">
    <!-- LEFT SIDEBAR: FY LIST -->
    <div
      class="col-12 col-md-4 col-xl-3 border-end h-100 d-flex flex-column"
      style="overflow: hidden"
    >
      <div class="p-3 pb-2">
        <div class="field-group mb-0 position-relative">
          <input
            type="text"
            class="form-control"
            style="padding-right: 35px"
            placeholder="Search years..."
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
          />
          <button
            *ngIf="searchTerm()"
            (click)="searchTerm.set('')"
            class="position-absolute end-0 top-50 translate-middle-y btn btn-link text-secondary p-2 shadow-none"
            style="right: 5px !important"
          >
            <mat-icon style="font-size: 18px; width: 18px; height: 18px"
              >close</mat-icon
            >
          </button>
        </div>
      </div>

      <div class="p-3 pt-0 flex-grow-1" style="overflow-y: auto">
        <div
          class="list-group list-group-flush border rounded-3 shadow-sm overflow-hidden"
        >
          <button
            *ngFor="let year of filteredYears()"
            type="button"
            class="list-group-item list-group-item-action p-3"
            [class.active]="selectedYearId() === year.id"
            (click)="selectYear(year)"
          >
            <div
              class="d-flex w-100 justify-content-between align-items-center mb-1"
            >
              <h6 class="mb-0 fw-bold">{{ year.yearName }}</h6>
              <span
                class="badge"
                [ngClass]="
                  year.status === 'active'
                    ? 'bg-success bg-opacity-10 text-success border border-success'
                    : 'bg-secondary bg-opacity-10 text-secondary border border-secondary'
                "
              >
                {{ year.status | uppercase }}
              </span>
            </div>
            <p class="mb-0 small fw-semibold opacity-75">
              {{ year.startDate | date: 'mediumDate' }} —
              {{ year.endDate | date: 'mediumDate' }}
            </p>
          </button>

          <div
            *ngIf="filteredYears().length === 0"
            class="p-4 text-center opacity-75"
          >
            <mat-icon
              class="opacity-50 mb-2"
              style="font-size: 32px; height: 32px; width: 32px"
              >event_busy</mat-icon
            >
            <p class="mb-0 small">No financial years found.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: FORM -->
    <div
      class="col-12 col-md-8 col-xl-9 h-100 d-flex flex-column"
      style="overflow: hidden"
    >
      <div class="page-card-body flex-grow-1" style="overflow-y: auto">
        <div class="card--main">
          <!-- <div
            class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom"
          >
            <h4 class="m-0 fw-bold d-flex align-items-center">
              <mat-icon style="color: var(--indigo) !important" class="me-2">
                {{ selectedYearId() ? 'edit_calendar' : 'add_circle' }}
              </mat-icon>
              {{
                selectedYearId()
                  ? 'Edit Period: ' + formdata.value.yearName
                  : 'New Financial Period'
              }}
            </h4>
          </div> -->

          <form [formGroup]="formdata" autocomplete="off">
            <div class="row row-group">
              <div class="col-xl-8">
                <div class="form-section-card card">
                  <div class="card-header">
                    <h4 class="card-header__title mb-0 fw-bold">
                      <mat-icon class="me-2 align-middle">info</mat-icon>
                      Period Settings
                    </h4>
                  </div>
                  <div class="card-body">
                    <div class="row row-group">
                      <div class="col-md-12">
                        <div class="field-group">
                          <label class="field-label required"
                            >Associated Branches</label
                          >
                          <ng-select
                            formControlName="branchIds"
                            [items]="branches()"
                            bindLabel="name"
                            bindValue="id"
                            [multiple]="true"
                            [closeOnSelect]="false"
                            [searchable]="true"
                            class="custom-ng-select"
                          >
                          </ng-select>
                        </div>
                      </div>
                      <div class="col-md-12">
                        <div class="field-group">
                          <label class="field-label required"
                            >Financial Year Name</label
                          >
                          <input
                            type="text"
                            formControlName="yearName"
                            class="form-control"
                            placeholder="e.g. FY 2024-25"
                          />
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="field-group">
                          <label class="field-label required">Start Date</label>
                          <div class="datepicker-wrapper">
                            <input
                              matInput
                              [matDatepicker]="startPicker"
                              formControlName="startDate"
                              class="form-control"
                              placeholder="MM/DD/YYYY"
                              (click)="startPicker.open()"
                            />
                            <mat-datepicker-toggle matSuffix [for]="startPicker">
                              <mat-icon matDatepickerToggleIcon>event</mat-icon>
                            </mat-datepicker-toggle>
                            <mat-datepicker #startPicker></mat-datepicker>
                          </div>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="field-group">
                          <label class="field-label required">End Date</label>
                          <div class="datepicker-wrapper">
                            <input
                              matInput
                              [matDatepicker]="endPicker"
                              formControlName="endDate"
                              class="form-control"
                              placeholder="MM/DD/YYYY"
                              (click)="endPicker.open()"
                            />
                            <mat-datepicker-toggle matSuffix [for]="endPicker">
                              <mat-icon matDatepickerToggleIcon>event</mat-icon>
                            </mat-datepicker-toggle>
                            <mat-datepicker #endPicker></mat-datepicker>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-xl-4">
                <div class="form-section-card card h-100">
                  <div class="card-header">
                    <h4 class="card-header__title mb-0 fw-bold">
                      <mat-icon class="me-2 align-middle">settings</mat-icon>
                      Status Control
                    </h4>
                  </div>
                  <div class="card-body">
                    <div class="field-group mb-3">
                      <label class="field-label">Accounting Status</label>
                      <ng-select
                        id="status"
                        formControlName="status"
                        class="custom-ng-select"
                        [searchable]="true"
                        [clearable]="true"
                      >
                        <ng-option value="active">Active (Open)</ng-option>
                        <ng-option value="inactive">Inactive</ng-option>
                        <ng-option value="closed">Permanently Closed</ng-option>
                      </ng-select>
                    </div>
                    <div class="border rounded-2 p-3">
                      <mat-checkbox formControlName="isDefault" color="primary">
                        <span class="fw-bold">Current Fiscal Year</span>
                        <p class="small m-0 text-secondary">
                          Set as the default period for all new transactions
                        </p>
                      </mat-checkbox>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
