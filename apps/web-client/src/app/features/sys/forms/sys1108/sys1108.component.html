<app-page-form-layout
  [title]="'Approval Workflow Setup'"
  [icon]="'approval'"
  [recordsCount]="scopeRows().length"
  [hasSidebar]="false"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="false"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>
  <div formContent class="flex flex-col gap-1 overflow-auto">
    <!-- Level 1: Workflow (master) -->
    <div class="form-section-card card">
      <div class="card-header d-flex align-items-center gap-2 flex-wrap">
        <h4 class="card-header__title mb-0 fw-bold">
          <mat-icon class="me-2 align-middle">business</mat-icon>
          Workflow
        </h4>
        <button
          type="button"
          class="btn-action btn-new btn-row-add ms-auto"
          title="Add Workflow"
          (click)="addScopeRow()"
        >
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div class="card-body p-0">
        <app-grid
          [config]="scopeGrid"
          [data]="scopeRows()"
          height="300px"
          [loading]="model.isLoading()"
          (ready)="onScopesReady($event)"
          (rowClick)="onScopeRowClick($event)"
        />
      </div>
    </div>

    <!-- Levels 2 & 3 -->
    <div class="row row-group m-0">
      <div class="col-6 p-0 pe-1">
        <div class="form-section-card card">
          <div class="card-header d-flex align-items-center gap-2 flex-wrap">
            <h4 class="card-header__title mb-0 fw-bold">
              <mat-icon class="me-2 align-middle">format_list_numbered</mat-icon>
              Approval Steps
            </h4>
            <button
              type="button"
              class="btn-action btn-new btn-row-add ms-auto"
              title="Add Step"
              [disabled]="!model.selectedScopeUid()"
              (click)="addStepRow()"
            >
              <mat-icon>add</mat-icon>
            </button>
          </div>
          <div class="card-body p-0">
            <app-grid
              [config]="stepGrid"
              [data]="stepRows()"
              height="300px"
              (ready)="onStepsReady($event)"
              (rowClick)="onStepRowClick($event)"
            />
          </div>
        </div>
      </div>

      <div class="col-6 p-0 ps-1">
        <div class="form-section-card card">
          <div class="card-header d-flex align-items-center gap-2 flex-wrap">
            <h4 class="card-header__title mb-0 fw-bold">
              <mat-icon class="me-2 align-middle">people</mat-icon>
              Step Approvers
            </h4>
            <button
              type="button"
              class="btn-action btn-new btn-row-add ms-auto"
              title="Add Approver"
              [disabled]="!model.selectedStepUid()"
              (click)="addStepApproverRow()"
            >
              <mat-icon>add</mat-icon>
            </button>
          </div>
          <div class="card-body p-0">
            <app-grid
              [config]="approverGrid"
              [data]="approverRows()"
              height="300px"
              (ready)="onApproversReady($event)"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</app-page-form-layout>
