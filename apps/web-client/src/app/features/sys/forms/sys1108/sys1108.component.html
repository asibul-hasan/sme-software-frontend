<app-page-form-layout
  [title]="'Approval Workflow Setup'"
  [icon]="'approval'"
  [recordsCount]="scopeTableData().length"
  [hasSidebar]="false"
  [searchTerm]="model.searchTerm()"
  (searchTermChange)="onSearchTermChange($event)"
  (save)="onSave()"
  (new)="onNew()"
  (reset)="onReset()"
  (delete)="onDelete()"
  [showSave]="permissionService.canInsert() || permissionService.canUpdate()"
  [showNew]="permissionService.canInsert()"
  [showDelete]="false"
  [isSaving]="model.isSaving()"
  [isLoading]="model.isLoading()"
>


  <div formContent class="gap-2 overflow-y-auto">
    <!-- Level 1: Approval Scope (Master) -->
    <div
      class="form-section-card card fill-card"
      style="
        flex: 1 1 33%;
        min-height: 250px;
        display: flex;
        flex-direction: column;
      "
    >
      <div class="card-header d-flex align-items-center gap-2 flex-wrap">
        <h4 class="card-header__title mb-0 fw-bold">
          <mat-icon class="me-2 align-middle">business</mat-icon>
          Workflow
        </h4>
        <button
          type="button"
          class="btn-action btn-new btn-row-add ms-auto"
          title="Add Workflow"
          (click)="addScopeRow()"
        >
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div
        class="card-body p-0"
        style="
          flex: 1 1 auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
        "
      >
        <app-common-table
          #scopesTable
          [columns]="scopeTableColumns()"
          [data]="scopeTableData()"
          [config]="scopeTableConfig"
          [tableId]="'scopes-table'"
          (rowClick)="onScopeRowClick($event)"
        ></app-common-table>
      </div>
    </div>

    <!-- Level 2 & 3: Split View -->
    <div class="row row-group m-0" style="flex: 1 1 66%; min-height: 250px">
      <!-- Level 2: Approval Steps -->
      <div class="col-6 p-0 pe-1 d-flex flex-column h-100">
        <div
          class="form-section-card card fill-card h-100"
          style="display: flex; flex-direction: column"
        >
          <div class="card-header d-flex align-items-center gap-2 flex-wrap">
            <h4 class="card-header__title mb-0 fw-bold">
              <mat-icon class="me-2 align-middle"
                >format_list_numbered</mat-icon
              >
              Approval Steps
            </h4>
            <button
              type="button"
              class="btn-action btn-new btn-row-add ms-auto"
              title="Add Step"
              [disabled]="!model.selectedScopeUid()"
              (click)="addStepRow()"
            >
              <mat-icon>add</mat-icon>
            </button>
          </div>
          <div
            class="card-body p-0"
            style="
              flex: 1 1 auto;
              min-height: 0;
              display: flex;
              flex-direction: column;
            "
          >
            <app-common-table
              #stepsTable
              [columns]="stepTableColumns()"
              [data]="stepTableData()"
              [config]="stepTableConfig"
              [tableId]="'steps-table'"
              (rowClick)="onStepRowClick($event)"
            ></app-common-table>
          </div>
        </div>
      </div>

      <!-- Level 3: Step Approvers -->
      <div class="col-6 p-0 ps-1 d-flex flex-column h-100">
        <div
          class="form-section-card card fill-card h-100"
          style="display: flex; flex-direction: column"
        >
          <div class="card-header d-flex align-items-center gap-2 flex-wrap">
            <h4 class="card-header__title mb-0 fw-bold">
              <mat-icon class="me-2 align-middle">people</mat-icon>
              Step Approvers
            </h4>
            <button
              type="button"
              class="btn-action btn-new btn-row-add ms-auto"
              title="Add Approver"
              [disabled]="!model.selectedStepUid()"
              (click)="addStepApproverRow()"
            >
              <mat-icon>add</mat-icon>
            </button>
          </div>
          <div
            class="card-body p-0"
            style="
              flex: 1 1 auto;
              min-height: 0;
              display: flex;
              flex-direction: column;
            "
          >
            <app-common-table
              #approversTable
              [columns]="approverTableColumns()"
              [data]="approverTableData()"
              [config]="approverTableConfig"
              [tableId]="'approvers-table'"
              (rowClick)="onApproverRowClick($event)"
            ></app-common-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-page-form-layout>
