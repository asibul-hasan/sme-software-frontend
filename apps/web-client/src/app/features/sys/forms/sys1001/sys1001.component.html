<app-page-form-layout
  [title]="'companyManagement' | translate"
  [subtitle]="'manageGlobalSettings' | translate"
  [icon]="'business'"
  [hasSidebar]="false"
  (save)="onSave()"
  [isSaving]="model.isSaving()"
  [showNew]="false"
  [showReset]="true"
  (reset)="onReset()"
  [showDelete]="false"
>
  <!-- Extra Header Action for Last Updated -->

  <!-- Main Form Content -->
  <div formContent>
    <form [formGroup]="model.form" autocomplete="off">
      <div class="row row-group">
        <!-- Left Column: Core Identity & Branding -->
        <div class="col-xl-8 col-lg-12">
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">info</mat-icon>
                {{ 'generalInfo' | translate }}
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label">{{
                      'companyCode' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="company_code"
                      class="form-control bg-light fw-bold"
                      readonly
                    />
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="field-group">
                    <label class="field-label required">{{
                      'companyName' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="company_name"
                      class="form-control form-control-lg fw-bold"
                      placeholder="{{ 'legalCompanyName' | translate }}"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'localName' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="company_name_local"
                      class="form-control"
                      placeholder="{{ 'localNamePlaceholder' | translate }}"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'companyType' | translate
                    }}</label>
                    <ng-select
                      formControlName="company_type"
                      [items]="sysConstants.companyTypes"
                      bindLabel="label"
                      bindValue="value"
                      placeholder="{{ 'selectType' | translate }}"
                    ></ng-select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Address & Contact -->
          <div class="form-section-card card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">place</mat-icon>
                {{ 'addressAndContact' | translate }}
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <!-- Addresses -->
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'addressLine1' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="address_line1"
                      class="form-control"
                      placeholder="{{ 'addressLine1Placeholder' | translate }}"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'addressLine2' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="address_line2"
                      class="form-control"
                      placeholder="{{ 'addressLine2Placeholder' | translate }}"
                    />
                  </div>
                </div>

                <!-- Location Details -->
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label">{{ 'city' | translate }}</label>
                    <input
                      type="text"
                      formControlName="city"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label">{{
                      'stateProvince' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="state_province"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="field-group">
                    <label class="field-label">{{
                      'postalCode' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="postal_code"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'country' | translate
                    }}</label>
                    <ng-select
                      formControlName="country_code"
                      [items]="SYS_CONSTS.countries"
                      bindLabel="label"
                      bindValue="value"
                    ></ng-select>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'website' | translate
                    }}</label>
                    <input
                      type="url"
                      formControlName="website"
                      class="form-control"
                      placeholder="https://..."
                    />
                  </div>
                </div>

                <!-- Contact Info -->
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'primaryPhone' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="phone_primary"
                      class="form-control"
                      placeholder="Primary phone"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'secondaryPhone' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="phone_secondary"
                      class="form-control"
                      placeholder="Secondary phone"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'primaryEmail' | translate
                    }}</label>
                    <input
                      type="email"
                      formControlName="email_primary"
                      class="form-control"
                      placeholder="Primary email"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="field-group">
                    <label class="field-label">{{
                      'secondaryEmail' | translate
                    }}</label>
                    <input
                      type="email"
                      formControlName="email_secondary"
                      class="form-control"
                      placeholder="Secondary email"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Logo & Legal -->
        <div class="col-xl-4 col-lg-12">
          <!-- Logo Card -->
          <div class="form-section-card card branding-card">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">brush</mat-icon>
                {{ 'branding' | translate }}
              </h4>
            </div>
            <div class="card-body">
              <app-logo-upload
                [previewUrl]="model.logoPreview()"
                [fileName]="model.logoFileName()"
                [isSaving]="model.isSaving()"
                (fileSelected)="model.onLogoSelected($event)"
                (clear)="model.clearLogo()"
              ></app-logo-upload>
            </div>
          </div>

          <!-- Legal Card -->
          <div class="form-section-card card mt-3">
            <div class="card-header">
              <h4 class="card-header__title mb-0 fw-bold">
                <mat-icon class="me-2 align-middle">gavel</mat-icon>
                {{ 'legal' | translate }}
              </h4>
            </div>
            <div class="card-body">
              <div class="row row-group">
                <div class="col-12">
                  <div class="field-group">
                    <label class="field-label">{{
                      'registrationNo' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="registration_no"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-12">
                  <div class="field-group">
                    <label class="field-label">{{
                      'tradeLicense' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="trade_license_no"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-12">
                  <div class="field-group">
                    <label class="field-label">{{
                      'vatReg' | translate
                    }}</label>
                    <input
                      type="text"
                      formControlName="vat_reg_no"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-6">
                  <div class="field-group">
                    <label class="field-label">TIN</label>
                    <input
                      type="text"
                      formControlName="tin_no"
                      class="form-control"
                    />
                  </div>
                </div>
                <div class="col-6">
                  <div class="field-group">
                    <label class="field-label">BIN</label>
                    <input
                      type="text"
                      formControlName="bin_no"
                      class="form-control"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</app-page-form-layout>
