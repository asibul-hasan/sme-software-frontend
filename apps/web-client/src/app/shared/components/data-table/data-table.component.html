<div class="table-container">
  
  <div class="table-toolbar">
    <!-- Search -->
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search..." #input>
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="toolbar-spacer"></div>

    <!-- Actions -->
    <button mat-raised-button color="primary" *ngIf="config.allowAdd" (click)="addRow()">
      <mat-icon>add</mat-icon> Add Row
    </button>

    <button mat-icon-button [matMenuTriggerFor]="columnMenu" *ngIf="config.allowColumnVisibility" matTooltip="Columns">
        <mat-icon>view_column</mat-icon>
    </button>
    <mat-menu #columnMenu="matMenu">
        <button mat-menu-item *ngFor="let col of columns" (click)="toggleColumnVisibility(col)">
            <mat-icon *ngIf="!col.hidden">check_box</mat-icon>
            <mat-icon *ngIf="col.hidden">check_box_outline_blank</mat-icon>
            {{col.header}}
        </button>
    </mat-menu>

    <button mat-icon-button (click)="exportToCsv()" *ngIf="config.allowExport" matTooltip="Export CSV">
      <mat-icon>download</mat-icon>
    </button>
  </div>

  <div class="mat-elevation-z8 table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Selection Column -->
       <ng-container matColumnDef="select" *ngIf="config.allowRowSelection">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="$event ? toggleAllRows() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Dynamic Columns -->
      <ng-container *ngFor="let col of visibleColumns" [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ col.header }} </th>
        <td mat-cell *matCellDef="let row">
          
          <!-- Editable Cell -->
          <ng-container *ngIf="col.editable; else viewMode">
             <ng-container [ngSwitch]="col.type">
                
                <mat-form-field *ngSwitchCase="'text'" appearance="outline" class="cell-input">
                    <input matInput [ngModel]="row[col.key]" (ngModelChange)="onCellEdit(row, col, $event)">
                </mat-form-field>

                <mat-form-field *ngSwitchCase="'number'" appearance="outline" class="cell-input">
                    <input matInput type="number" [ngModel]="row[col.key]" (ngModelChange)="onCellEdit(row, col, $event)">
                </mat-form-field>

                <mat-form-field *ngSwitchCase="'select'" appearance="outline" class="cell-input">
                    <mat-select [ngModel]="row[col.key]" (ngModelChange)="onCellEdit(row, col, $event)">
                        <mat-option *ngFor="let opt of col.options" [value]="opt.value">{{opt.label}}</mat-option>
                    </mat-select>
                </mat-form-field>
                
                <!-- Default to text if type not matched -->
                <mat-form-field *ngSwitchDefault appearance="outline" class="cell-input">
                     <input matInput [ngModel]="row[col.key]" (ngModelChange)="onCellEdit(row, col, $event)">
                </mat-form-field>

             </ng-container>
          </ng-container>

          <!-- View Mode -->
          <ng-template #viewMode>
             {{ row[col.key] }}
          </ng-template>

        </td>
      </ng-container>
      
      <!-- Actions Column (Hardcoded for now based on config, or dynamic if we want) -->
      <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="warn" (click)="deleteRow(row)" *ngIf="config.allowDelete">
                  <mat-icon>delete</mat-icon>
              </button>
               <!-- Custom Actions could go here -->
          </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          [class.row-deleted]="row.sqlState === 3"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="config.pageSizeOptions || [5, 10, 25, 100]" aria-label="Select page"></mat-paginator>
  </div>
</div>
