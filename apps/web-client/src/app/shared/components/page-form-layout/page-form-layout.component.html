<div class="page-card">
  <!-- ── CARD HEADER (Sticky Top) ─────────────────────── -->
  <div
    class="page-card-header flex flex-col justify-between px-2 py-1 shrink-0 md:flex-row"
  >
    <div class="flex items-center gap-2 py-1">
      <div class="header-icon-box shadow-sm">
        <mat-icon>{{ icon }}</mat-icon>
      </div>
      <div>
        <h2 class="page-card-title m-0 gradient-text-header">
          {{ title }}
        </h2>
        <!-- <p class="text-subtle m-0 small mt-1">
          {{ subtitle }}
        </p> -->
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-action-group flex !gap-2">
      <button
        *ngIf="showSave"
        class="btn-action btn-save"
        (click)="save.emit()"
        [matTooltip]="'save' | translate"
        [disabled]="isSaving"
      >
        <mat-icon>{{ isSaving ? 'hourglass_empty' : 'done_all' }}</mat-icon>
        <span class="btn-action-label">{{ 'save' | translate }}</span>
      </button>

      <button
        *ngIf="showNew"
        class="btn-action btn-new"
        (click)="new.emit()"
        [matTooltip]="'new' | translate"
      >
        <mat-icon>add</mat-icon>
        <span class="btn-action-label">{{ 'new' | translate }}</span>
      </button>

      <button
        *ngIf="showReset"
        class="btn-action btn-reset"
        (click)="reset.emit()"
        [matTooltip]="'reset' | translate"
      >
        <mat-icon>refresh</mat-icon>
        <span class="btn-action-label">{{ 'reset' | translate }}</span>
      </button>

      <button
        *ngIf="showDelete"
        class="btn-action btn-delete"
        (click)="delete.emit()"
        [matTooltip]="'delete' | translate"
      >
        <mat-icon>delete</mat-icon>
        <span class="btn-action-label">{{ 'delete' | translate }}</span>
      </button>

      <ng-content select="[extraHeaderActions]"></ng-content>
    </div>
  </div>

  <!-- ── OPTIONAL TAB BAR (fixed, inside the page height) ── -->
  <ng-content select="[tabBarContent]"></ng-content>

  <!-- ── SPLIT BODY ──────────────────── -->
  <div class="row g-0 grow form-content-row overflow-hidden">
    <!-- LEFT SIDEBAR -->
    <div
      *ngIf="hasSidebar"
      class="col-12 col-md-4 col-xl-3 h-full flex flex-col border-r border-line form-content-col"
    >
      <!-- Fixed: filters → search → results meta bar -->
      <div class="sidebar-filters-section shrink-0 border-b border-line">
        <!-- 1. Host-provided filter dropdowns (top) -->
        <ng-content select="[sidebarFilters]"></ng-content>

        <!-- 2. Search (with clear) + sort toggle -->
        <div class="px-2 pt-1 pb-2 flex items-center gap-2">
          <div class="field-group mb-0 sidebar-search grow">
            <mat-icon class="sidebar-search__icon">search</mat-icon>
            <input
              type="text"
              class="form-control sidebar-search__input"
              [placeholder]="'search' | translate"
              [ngModel]="searchTerm"
              (ngModelChange)="onSearchChange($event)"
            />
            <button
              *ngIf="searchTerm"
              type="button"
              class="sidebar-search__clear"
              (click)="clearSearch()"
              matTooltip="Clear search"
            >
              <mat-icon>close</mat-icon>
            </button>
          </div>

          <button
            *ngIf="showSort"
            type="button"
            class="sidebar-sort-btn"
            (click)="toggleSort()"
            [matTooltip]="sortTitle"
          >
            <mat-icon>{{ sortIcon }}</mat-icon>
          </button>
        </div>

        <!-- 3. Clear-all — intentionally disabled (kept for reference).
             The search box's own × and each filter's clear already cover it.
        <div class="sidebar-meta-bar px-2 pb-2" *ngIf="isFiltering">
          <button
            type="button"
            class="sidebar-meta-bar__clear"
            (click)="clearAll()"
            matTooltip="Clear search & filters"
          >
            <mat-icon>filter_alt_off</mat-icon> Clear all
          </button>
        </div>
        -->
      </div>

      <!-- Scrollable: list content -->
      <div class="grow overflow-auto sidebar-scroll-area">
        <div class="sidebar-list-wrap">
          <ng-content select="[sidebarList]"></ng-content>
        </div>
      </div>

      <!-- Fixed: optional footer (e.g. pagination) -->
      <div class="sidebar-footer shrink-0">
        <ng-content select="[sidebarFooter]"></ng-content>
      </div>
    </div>

    <!-- RIGHT SIDE: FORM -->
    <div
      [ngClass]="hasSidebar ? 'col-12 col-md-8 col-xl-9' : 'col-12'"
      class="h-full flex flex-col form-content-col overflow-auto"
    >
      <div class="page-card-body grow !p-2">
        <ng-content select="[formContent]"></ng-content>
      </div>
    </div>
  </div>
</div>
