<div class="page-card d-flex flex-column h-100">
  <!-- ── CARD HEADER (Sticky Top) ─────────────────────── -->
  <div
    class="page-card-header d-flex flex-column flex-md-row justify-content-between px-2 py-1 border-bottom flex-shrink-0"
  >
    <div class="d-flex align-items-center gap-2 py-1">
      <div class="header-icon-box shadow-sm">
        <mat-icon>{{ icon }}</mat-icon>
      </div>
      <div>
        <h2 class="page-card-title m-0 fw-bolder gradient-text-header">
          {{ title }}
        </h2>
        <p class="text-secondary m-0 small mt-1">
          {{ subtitle }}
        </p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-action-group mt-md-0 d-flex gap-2">
      <button
        *ngIf="showSave"
        class="btn-action btn-save"
        (click)="save.emit()"
        [matTooltip]="'save' | translate"
        [disabled]="isSaving"
      >
        <mat-icon>{{ isSaving ? 'hourglass_empty' : 'done_all' }}</mat-icon>
        <span class="btn-action-label">{{ 'save' | translate }}</span>
      </button>

      <button
        *ngIf="showNew"
        class="btn-action btn-new"
        (click)="new.emit()"
        [matTooltip]="'new' | translate"
      >
        <mat-icon>add</mat-icon>
        <span class="btn-action-label">{{ 'new' | translate }}</span>
      </button>

      <button
        *ngIf="showReset"
        class="btn-action btn-reset"
        (click)="reset.emit()"
        [matTooltip]="'reset' | translate"
      >
        <mat-icon>refresh</mat-icon>
        <span class="btn-action-label">{{ 'reset' | translate }}</span>
      </button>

      <button
        *ngIf="showDelete"
        class="btn-action btn-delete"
        (click)="delete.emit()"
        [matTooltip]="'delete' | translate"
      >
        <mat-icon>delete</mat-icon>
        <span class="btn-action-label">{{ 'delete' | translate }}</span>
      </button>

      <ng-content select="[extraHeaderActions]"></ng-content>
    </div>
  </div>

  <!-- ── OPTIONAL TAB BAR (fixed, inside the page height) ── -->
  <ng-content select="[tabBarContent]"></ng-content>

  <!-- ── SPLIT BODY ──────────────────── -->
  <div class="row g-0 flex-grow-1 form-content-row overflow-hidden">
    <!-- LEFT SIDEBAR -->
    <div
      *ngIf="hasSidebar"
      class="col-12 col-md-4 col-xl-3 border-end h-100 d-flex flex-column form-content-col"
    >

      <!-- Fixed: optional extra filters + search at bottom of section -->
      <div class="sidebar-filters-section flex-shrink-0 border-bottom">
        <ng-content select="[sidebarFilters]"></ng-content>

        <div class="px-2 py-2">
          <div class="field-group mb-0 sidebar-search">
            <mat-icon class="sidebar-search__icon">search</mat-icon>
            <input
              type="text"
              class="form-control sidebar-search__input"
              [placeholder]="'search' | translate"
              [ngModel]="searchTerm"
              (ngModelChange)="onSearchChange($event)"
            />
          </div>
        </div>
      </div>

      <!-- Scrollable: list content -->
      <div class="flex-grow-1 overflow-auto sidebar-scroll-area p-2">
        <div
          class="list-group list-group-flush border rounded-3 shadow-sm overflow-hidden"
        >
          <ng-content select="[sidebarList]"></ng-content>
        </div>
      </div>

      <!-- Fixed: optional footer (e.g. pagination) -->
      <div class="sidebar-footer flex-shrink-0">
        <ng-content select="[sidebarFooter]"></ng-content>
      </div>
    </div>

    <!-- RIGHT SIDE: FORM -->
    <div
      [ngClass]="hasSidebar ? 'col-12 col-md-8 col-xl-9' : 'col-12'"
      class="h-100 d-flex flex-column form-content-col overflow-auto"
    >
      <div class="page-card-body flex-grow-1 p-2">
        <ng-content select="[formContent]"></ng-content>
      </div>
    </div>
  </div>
</div>
