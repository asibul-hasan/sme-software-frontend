<aside
  class="sidebar flex flex-col items-center z-[3] overflow-hidden"
  [class.collapsed]="isCollapsed()"
>
  <!-- Logo -->
  <div
    class="sb-logo flex items-center justify-center shrink-0 overflow-hidden mb-4"
    [routerLink]="['/']"
  >
    <span class="logo-main font-black">A</span>
    <span class="logo-sub font-bold" *ngIf="!isCollapsed()">IDLY</span>
    <span class="logo-x font-semibold opacity-75" *ngIf="isCollapsed()">X</span>
  </div>

  <!-- Top Search & Collapse Toggle Section -->
  <div
    class="sb-search-container w-full px-4 pb-4 flex items-center justify-between gap-2"
    *ngIf="!isCollapsed()"
  >
    <div class="search-input-wrapper relative grow">
      <ui-icon class="search-icon" [size]="18">search</ui-icon>
      <input
        type="text"
        class="sb-search-input"
        placeholder="Search menu..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
      />

      <button
        type="button"
        class="clear-search-btn flex items-center justify-center w-7 h-7 border-0 bg-transparent p-0 cursor-pointer rounded"
        *ngIf="searchTerm()"
        (click)="searchTerm.set('')"
      >
        <ui-icon [size]="18">close</ui-icon>
      </button>
    </div>

    <button
      type="button"
      class="sb-collapse-toggle-btn flex items-center justify-center shrink-0 p-0 cursor-pointer"
      (click)="toggleExpandAll()"
      [uiTooltip]="isAllExpanded() ? 'Collapse All' : 'Expand All'"
      uiTooltipPosition="above"
    >
      <ui-icon [size]="18">{{
        isAllExpanded() ? 'unfold_less_double' : 'unfold_more_double'
      }}</ui-icon>
    </button>
  </div>

  <!-- Menu Items -->
  <nav
    class="sb-nav flex flex-col items-center grow w-full overflow-y-auto overflow-x-hidden"
  >
    <ng-container *ngFor="let module of filteredMenuItems()">
      <!-- MODULE -->
      <div class="sb-module w-full flex flex-col items-center">
        <a
          class="sb-item module-item px-2 w-full flex items-center shrink-0 no-underline relative whitespace-nowrap overflow-hidden"
          (click)="toggleNode(module, $event)"
          [class.expanded-item]="!isCollapsed()"
          [uiTooltip]="module.formName | translate"
          uiTooltipPosition="right"
        >
          <ui-icon class="sb-icon shrink-0" [size]="19">{{
            module.icon
          }}</ui-icon>
          <span class="sb-label" *ngIf="!isCollapsed()">
            {{ module.formName | translate }}
          </span>
          <ui-icon *ngIf="!isCollapsed()" class="expand-icon" [size]="18">
            {{ module.expanded ? 'expand_less' : 'expand_more' }}
          </ui-icon>
        </a>
        <!-- SUBMODULE -->
        <div
          class="sb-submodule w-full flex flex-col items-center"
          *ngIf="module.expanded && module.children"
        >
          <ng-container
            *ngFor="let sub of module.children; let isLastSub = last"
          >
            <div
              class="w-full relative flex flex-col items-center"
              style="gap: 2px"
            >
              <!-- Tree Lines for Submodule -->
              <div class="line-sub-connect" *ngIf="!isCollapsed()"></div>
              <div
                class="line-sub-v-bottom"
                *ngIf="!isCollapsed() && !isLastSub"
              ></div>

              <a
                class="sb-item submodule-item px-2 w-full flex items-center shrink-0 no-underline relative whitespace-nowrap overflow-hidden z-[1]"
                (click)="toggleNode(sub, $event)"
                [uiTooltip]="sub.formName | translate"
                uiTooltipPosition="right"
              >
                <ui-icon class="sb-icon shrink-0" [size]="19">{{
                  sub.icon
                }}</ui-icon>
                <span class="sb-label" *ngIf="!isCollapsed()">
                  {{ sub.formName | translate }}
                </span>
                <ui-icon *ngIf="!isCollapsed()" class="expand-icon" [size]="18">
                  {{ sub.expanded ? 'expand_less' : 'expand_more' }}
                </ui-icon>
              </a>
              <!-- FORMS -->
              <div
                class="sb-forms w-full flex flex-col items-center"
                *ngIf="sub.expanded && sub.children"
              >
                <ng-container
                  *ngFor="let form of sub.children; let isLastForm = last"
                >
                  <div
                    class="w-full relative flex flex-col items-center"
                    style="gap: 2px"
                  >
                    <!-- Tree Lines for Forms -->
                    <div class="line-form-connect" *ngIf="!isCollapsed()"></div>
                    <div
                      class="line-form-v-bottom"
                      *ngIf="!isCollapsed() && !isLastForm"
                    ></div>

                    <a
                      class="sb-item form-item px-2 w-full flex items-center shrink-0 no-underline relative whitespace-nowrap overflow-hidden z-[1]"
                      [routerLink]="form.route"
                      routerLinkActive="active"
                      [routerLinkActiveOptions]="{ exact: false }"
                      [uiTooltip]="form.formName | translate"
                      uiTooltipPosition="right"
                    >
                      <ui-icon class="sb-icon shrink-0" [size]="19">{{
                        form.icon
                      }}</ui-icon>
                      <span class="sb-label" *ngIf="!isCollapsed()">
                        {{ form.formName | translate }}
                      </span>
                    </a>
                  </div>
                </ng-container>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </ng-container>
  </nav>

  <!-- Bottom Section -->
  <div
    class="sb-bottom flex items-center justify-end flex-wrap gap-2 w-full"
    style="border-top: 1px solid var(--border)"
  >
    <!-- Toggle Collapse Button -->
    <div class="flex items-center justify-end w-full py-2">
      <button
        type="button"
        class="sb-toggle-btn m-0 p-0"
        (click)="toggleSidebar()"
        [title]="isCollapsed() ? 'Expand' : 'Collapse'"
      >
        <ui-icon [size]="16">{{
          isCollapsed() ? 'chevron_right' : 'chevron_left'
        }}</ui-icon>
      </button>
    </div>
  </div>
</aside>
