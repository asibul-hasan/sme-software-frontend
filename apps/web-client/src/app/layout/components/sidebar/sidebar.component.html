<aside
  class="sidebar h-full overflow-hidden"
  [style.width.px]="isCollapsed() ? 64 : 315"
  [class.collapsed]="isCollapsed()"
  [class.flyout-open]="isCollapsed() && isFlyoutOpen()"
  (mouseleave)="closeFlyout()"
  (focusout)="onSidebarFocusOut($event)"
>
  <div class="sb-body flex flex-1 min-h-0">
    <div class="sb-rail flex flex-col h-full flex-shrink-0">
      <a
        class="sb-rail-brand flex items-center justify-center flex-shrink-0"
        [routerLink]="['/']"
        [uiTooltip]="companyName()"
        uiTooltipPosition="right"
      >
        <ng-container *ngIf="logoUrl(); else initialTpl">
          <img [src]="logoUrl()" alt="Company logo" class="sb-rail-logo" />
        </ng-container>
        <ng-template #initialTpl>
          <span class="sb-rail-initial">{{ companyInitial() }}</span>
        </ng-template>
      </a>

      <nav class="sb-module-list flex-1 overflow-y-auto overflow-x-hidden">
      <button
        *ngFor="let module of menuItems()"
        type="button"
        class="sb-module-btn"
        [class.active]="isModuleSelected(module)"
        [class.route-active]="hasActiveChild(module)"
        (mouseenter)="openFlyout(module)"
        (focus)="openFlyout(module)"
        (click)="selectModule(module)"
        [uiTooltip]="module.formName | translate"
        uiTooltipPosition="right"
      >
        <span class="sb-module-icon">
          <ui-icon [size]="21">{{ module.icon }}</ui-icon>
        </span>
        <span class="sb-module-label">{{ moduleShortLabel(module) }}</span>
      </button>
      </nav>

    </div>

    <section
      *ngIf="shouldShowPanel()"
      class="sb-panel flex flex-col h-full min-w-0"
      [class.flyout]="isCollapsed() && isFlyoutOpen()"
      (mouseenter)="openFlyout()"
    >
    <header class="sb-panel-head flex items-center flex-shrink-0">
      <div class="sb-panel-title min-w-0">
        <h2 class="sb-module-heading truncate">{{ selectedModuleLabel() | translate }}</h2>
        <p class="sb-company mb-0 truncate">{{ companyName() }}</p>
      </div>
    </header>

    <div class="sb-search-row flex items-center gap-2 flex-shrink-0">
      <div class="sb-search-wrap flex-1 min-w-0">
        <ui-icon class="sb-search-icon" [size]="16">search</ui-icon>
        <input
          type="text"
          class="sb-search-input"
          placeholder="Search menu..."
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
        />
        <button
          *ngIf="searchTerm()"
          type="button"
          class="sb-search-clear"
          (click)="searchTerm.set('')"
          title="Clear search"
        >
          <ui-icon [size]="15">close</ui-icon>
        </button>
      </div>
      <button
        type="button"
        class="sb-action-btn"
        (click)="toggleExpandAll()"
        [uiTooltip]="isAllExpanded() ? 'Collapse All' : 'Expand All'"
        uiTooltipPosition="above"
      >
        <ui-icon [size]="17">{{ isAllExpanded() ? 'unfold_less_double' : 'unfold_more_double' }}</ui-icon>
      </button>
    </div>

    <nav class="sb-menu-panel flex-1 overflow-y-auto overflow-x-hidden">
      <ng-container *ngFor="let sub of filteredSubMenuItems(); let isLastSub = last">
        <div class="sb-sub-group">
          <a
            *ngIf="sub.route && !sub.children?.length; else subGroupButton"
            class="sb-sub-btn sb-sub-link"
            [routerLink]="sub.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onMenuItemSelected()"
          >
            <ui-icon class="sb-sub-icon" [size]="18">{{ sub.icon }}</ui-icon>
            <span class="sb-sub-label truncate">{{ sub.formName | translate }}</span>
          </a>

          <ng-template #subGroupButton>
          <button
            type="button"
            class="sb-sub-btn"
            [class.active]="hasActiveChild(sub)"
            (click)="toggleNode(sub, $event)"
          >
            <ui-icon class="sb-sub-icon" [size]="18">{{ sub.icon }}</ui-icon>
            <span class="sb-sub-label truncate">{{ sub.formName | translate }}</span>
            <ui-icon class="sb-chevron" [size]="17">{{ sub.expanded ? 'expand_less' : 'expand_more' }}</ui-icon>
          </button>
          </ng-template>

          <div *ngIf="sub.expanded && sub.children?.length" class="sb-form-list">
            <ng-container *ngFor="let form of sub.children; let isLastForm = last">
              <div class="sb-form-row">
                <a
                  class="sb-form-link"
                  [routerLink]="form.route"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: false }"
                  (click)="onMenuItemSelected()"
                >
                  <ui-icon class="sb-form-icon" [size]="17">{{ form.icon }}</ui-icon>
                  <span class="sb-form-label truncate">{{ form.formName | translate }}</span>
                </a>
              </div>
            </ng-container>
          </div>
        </div>
      </ng-container>

      <div *ngIf="filteredSubMenuItems().length === 0" class="sb-empty-state">
        <ui-icon [size]="26">search_off</ui-icon>
        <span>No menu found</span>
      </div>
    </nav>
    </section>
  </div>
</aside>
