<footer
  class="flex h-[25px] w-full items-center justify-center gap-2 border-t border-[var(--header-border)] bg-header px-4 text-[11px] text-header-foreground backdrop-blur-[20px] md:justify-between md:px-6"
  [class.collapsed]="isCollapsed()"
>
  <!-- Left: Brand & Version -->
  <div class="flex items-center gap-2">
    <span
      class="m-0 inline-flex items-baseline text-[14px] font-bold tracking-[-0.02em]"
    >
      <span class="text-[16px] text-indigo">A</span>
      <span class="text-white/90">IDLY</span>
      <span class="ml-1 text-[10px] font-normal text-header-foreground/50"
        >by</span
      >
      <span class="ml-1 text-[11px] text-rose/80">InfoaidTech</span>
    </span>
    <span
      class="mx-1 hidden text-[14px] text-[var(--header-border)] opacity-50 md:inline"
      >|</span
    >
    <span
      class="hidden rounded-[20px] border border-[rgba(var(--indigo-rgb),0.2)] bg-[rgba(var(--indigo-rgb),0.1)] px-[10px] py-[1px] text-[10px] font-medium text-indigo [font-family:monospace] md:inline"
    >
      ERP v2025.1
    </span>
  </div>

  <!-- Center: Copyright -->
  <div class="hidden grow text-center md:block">
    <span class="tracking-[0.2px] text-header-foreground/50">
      © {{ currentYear }} Infoaidtech. All rights reserved.
    </span>
  </div>

  <!-- Right: Status & Links -->
  <div class="hidden items-center gap-2 md:flex">
    <span
      class="flex items-center gap-1 font-medium text-header-foreground/70"
    >
      <span
        class="h-1.5 w-1.5 shrink-0 animate-[statusPulse_2.5s_ease-in-out_infinite] rounded-full bg-emerald shadow-[0_0_8px_var(--emerald)]"
      ></span>
      {{ 'allSystemsOperational' | translate }}
    </span>
    <span class="mx-1 text-[14px] text-[var(--header-border)] opacity-50"
      >|</span
    >
    <a
      class="cursor-pointer text-header-foreground/60 no-underline transition-all duration-200 hover:text-indigo hover:underline"
      href="#"
      (click)="onHelp($event)"
    >
      {{ 'help' | translate }}
    </a>
    <span class="mx-1 text-[14px] text-[var(--header-border)] opacity-50"
      >|</span
    >
    <a
      class="cursor-pointer text-header-foreground/60 no-underline transition-all duration-200 hover:text-indigo hover:underline"
      href="#"
      (click)="onPrivacy($event)"
    >
      {{ 'privacy' | translate }}
    </a>
  </div>
</footer>
