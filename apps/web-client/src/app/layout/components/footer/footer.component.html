<footer
  class="app-footer d-flex align-items-center justify-content-center justify-content-md-between px-3 px-md-4 gap-2"
  [class.collapsed]="isCollapsed()"
>
  <div class="footer-logo-area d-flex align-items-center gap-2">
    <span class="navbar-brand fw-bold d-inline-flex align-items-baseline m-0">
      <span class="brand-a">A</span>
      <span class="brand-idly">IDLY</span>
      <span class="brand-by ms-1 fw-normal">by</span>
      <span class="brand-partner ms-1">InfoaidTech</span>
    </span>
    <span class="footer-sep d-none d-md-inline">|</span>
    <span class="version-chip d-none d-md-inline">
      ERP v2025.1
    </span>
  </div>

  <div class="footer-copyright flex-grow-1 text-center d-none d-md-block">
    <span>
      © {{ currentYear }} Infoaidtech. All rights reserved.
    </span>
  </div>

  <div class="footer-status-area d-flex align-items-center gap-2 d-none d-md-flex">
    <span class="status-indicator d-flex align-items-center gap-1 fw-medium">
      <span class="status-dot flex-shrink-0"></span>
      {{ 'allSystemsOperational' | translate }}
    </span>
    <span class="footer-sep">|</span>
    <a
      class="footer-link"
      href="#"
      (click)="onHelp($event)"
    >
      {{ 'help' | translate }}
    </a>
    <span class="footer-sep">|</span>

    <a
      class="footer-link"
      href="#"
      (click)="onPrivacy($event)"
    >
      {{ 'privacy' | translate }}
    </a>
  </div>
</footer>
