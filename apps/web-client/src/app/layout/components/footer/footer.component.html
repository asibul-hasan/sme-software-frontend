<footer
  class="app-footer d-flex align-items-center justify-content-center justify-content-md-between px-3 px-md-4 gap-2"
  [style.left.px]="isCollapsed() ? 72 : 230"
  style="
    position: fixed;
    right: 0;
    bottom: 0;
    z-index: 100;
    height: 24px;
    background: var(--footer-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-3);
  "
>
  <div class="d-flex align-items-center gap-2">
    <span
      class="navbar-brand fw-bold d-inline-flex align-items-baseline m-0"
      style="letter-spacing: -0.02em"
    >
      <span class="fs-6" style="color: var(--indigo)">A</span>
      <span class="small" style="color: var(--text-1)">IDLY</span>
      <span class="small ms-1 fw-normal" style="color: var(--text-3)">by</span>
      <span class="small ms-1" style="color: var(--rose)">InfoaidTech</span>
    </span>
    <span class="d-none d-md-inline mx-1" style="color: var(--text-4); font-size: 14px"
      >|</span
    >
    <span
      class="font-monospace px-2 rounded-pill d-none d-md-inline"
      style="
        font-size: 10px;
        padding-top: 2px;
        padding-bottom: 2px;
        background: rgba(var(--indigo-rgb), 0.1);
        border: 1px solid rgba(var(--indigo-rgb), 0.2);
        color: var(--indigo);
      "
    >
      ERP v2025.1
    </span>
  </div>

  <div class="flex-grow-1 text-center d-none d-md-block">
    <span style="color: var(--text-3); font-size: 11px">
      © {{ currentYear }} Infoaidtech. All rights reserved.
    </span>
  </div>

  <div class="d-flex align-items-center gap-2 d-none d-md-flex">
    <span
      class="d-flex align-items-center gap-1 fw-medium"
      style="font-size: 11px; color: var(--text-2)"
    >
      <span class="status-dot flex-shrink-0" style="width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 6px var(--emerald);"></span>
      {{ 'allSystemsOperational' | translate }}
    </span>
    <span class="mx-1" style="color: var(--text-4); font-size: 14px">|</span>
    <a
      class="text-decoration-none footer-link"
      style="font-size: 11px; color: var(--text-3);"
      href="#"
      (click)="onHelp($event)"
    >
      {{ 'help' | translate }}
    </a>
    <span class="mx-1" style="color: var(--text-4); font-size: 14px">|</span>

    <a
      class="text-decoration-none footer-link"
      style="font-size: 11px; color: var(--text-3);"
      href="#"
      (click)="onPrivacy($event)"
    >
      {{ 'privacy' | translate }}
    </a>
  </div>
</footer>
