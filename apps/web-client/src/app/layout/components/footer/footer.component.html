<footer
  class="app-footer flex items-center justify-center md:justify-between px-4 md:px-6 gap-2"
  [class.collapsed]="isCollapsed()"
>
  <div class="footer-logo-area flex items-center gap-2">
    <span class="footer-brand font-bold inline-flex items-baseline m-0">
      <span class="brand-a">A</span>
      <span class="brand-idly">IDLY</span>
      <span class="brand-by ms-1 font-normal">by</span>
      <span class="brand-partner ms-1">InfoaidTech</span>
    </span>
    <span class="footer-sep hidden md:inline">|</span>
    <span class="version-chip hidden md:inline"> ERP v2025.1 </span>
  </div>

  <div class="footer-copyright grow text-center hidden md:block">
    <span> © {{ currentYear }} Infoaidtech. All rights reserved. </span>
  </div>

  <div class="footer-status-area hidden md:flex items-center gap-2">
    <span class="status-indicator flex items-center gap-1 font-medium">
      <span class="status-dot shrink-0"></span>
      {{ 'allSystemsOperational' | translate }}
    </span>
    <span class="footer-sep">|</span>
    <a class="footer-link" href="#" (click)="onHelp($event)">
      {{ 'help' | translate }}
    </a>
    <span class="footer-sep">|</span>

    <a class="footer-link" href="#" (click)="onPrivacy($event)">
      {{ 'privacy' | translate }}
    </a>
  </div>
</footer>
