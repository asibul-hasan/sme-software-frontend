<div class="lock-card">
  <div class="lock-avatar">
    <mat-icon>account_circle</mat-icon>
  </div>

  <h2 class="lock-name">{{ user()?.name || 'Session Locked' }}</h2>
  @if (user()?.email) {
    <p class="lock-email">{{ user()?.email }}</p>
  }

  <form [formGroup]="lockForm" (ngSubmit)="onSubmit()" class="lock-form">
    <label class="lock-label" for="lockPassword">Password Required</label>

    <div class="lock-field" [class.lock-field--invalid]="error()">
      <mat-icon class="lock-field__icon">lock</mat-icon>
      <input
        id="lockPassword"
        class="lock-field__input"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        placeholder="Enter password to unlock"
        autocomplete="current-password"
      />
      <button
        type="button"
        class="lock-field__toggle"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        (click)="showPassword.set(!showPassword())"
      >
        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>

    @if (error()) {
      <p class="lock-error">
        <mat-icon>error_outline</mat-icon>
        <span>{{ error() }}</span>
      </p>
    }

    <button
      type="submit"
      class="lock-submit"
      [disabled]="lockForm.invalid || isLoading()"
    >
      @if (isLoading()) {
        <span class="lock-spinner"></span>
        <span>Unlocking…</span>
      } @else {
        <mat-icon>lock_open</mat-icon>
        <span>Unlock Session</span>
      }
    </button>

    <button type="button" class="lock-switch" (click)="onSwitchUser()">
      <mat-icon>swap_horiz</mat-icon>
      <span>Switch Account</span>
    </button>
  </form>
</div>
