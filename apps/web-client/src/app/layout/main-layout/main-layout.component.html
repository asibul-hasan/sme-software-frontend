<!-- Root shell: sidebar | right-column, full viewport height -->
<div class="flex flex-row h-screen overflow-hidden bg-[var(--bg-primary)]" style="background-image: var(--bg-gradient)">

  <!-- Sidebar: inline flex child on desktop, fixed overlay on mobile -->
  <app-sidebar
    class="app-sidebar flex-shrink-0 h-full block z-50"
    [class.sidebar-collapsed]="sidebarCollapsed()"
    [collapsed]="sidebarCollapsed()"
    (toggleCollapse)="toggleSidebar()"
  ></app-sidebar>

  <!-- Backdrop: mobile only — tap to close sidebar -->
  <div
    *ngIf="!sidebarCollapsed()"
    class="sidebar-overlay fixed inset-0 bg-black/45 z-[190] cursor-pointer hidden"
    (click)="toggleSidebar()"
  ></div>

  <!-- Right column: header → content → footer -->
  <div class="app-right flex flex-col flex-1 min-w-0 h-screen overflow-hidden">

    <app-header
      class="flex-shrink-0 block w-full z-[100]"
      [sidebarCollapsed]="sidebarCollapsed()"
      (toggleSidebar)="toggleSidebar()"
      (themeToggled)="onThemeToggle($event)"
    ></app-header>

    <main class="flex flex-col flex-1 min-h-0 overflow-hidden relative">
      <app-global-loader></app-global-loader>
      <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-2">
        <router-outlet></router-outlet>
      </div>
    </main>

    <app-footer
      class="flex-shrink-0 block w-full"
      [sidebarCollapsed]="sidebarCollapsed()"
    ></app-footer>

  </div>

  <!-- Global ERP Command Palette (Ctrl+K) -->
  <erp-command-palette></erp-command-palette>
</div>

<!--
  Mounted at the layout ROOT, deliberately outside <app-header>.

  It used to live inside the header component. `<app-header>` is a flex item carrying `z-[100]`,
  and a flex item with an explicit z-index establishes a stacking context even without `position` —
  so the toast's own `z-index: 1080` was resolved INSIDE that z-100 context. A Material dialog sits
  at z-1000 on `.cdk-overlay-container` at body level, so the dialog always won and no amount of
  raising 1080 could change it.

  Out here it competes at the root stacking context, above the CDK overlay.
-->
<app-notification-toast></app-notification-toast>
