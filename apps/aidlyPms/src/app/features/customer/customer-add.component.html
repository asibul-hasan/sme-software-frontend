<div class="w-full space-y-4">
  <app-page-header
    title="Add Customer"
    subtitle="Register a new retail, wholesale, or corporate pharmacy client"
    formId="SALE_1403"
    [breadcrumbs]="[{ label: 'Customers', url: '/customer/list' }, { label: 'Add Customer' }]"
  >
    <div actions class="flex items-center gap-2">
      <button nz-button nzType="default" (click)="goBack()" class="rounded-md">
        <span nz-icon nzType="arrow-left"></span> Back
      </button>
    </div>
  </app-page-header>

  <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-6">
    <form (ngSubmit)="submitForm()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="customer-add-customer-name-1" class="block text-xs font-semibold text-slate-700 mb-1">
            Customer Name <span class="text-rose-500">*</span>
          </label>
          <input id="customer-add-customer-name-1"
            type="text"
            nz-input
            placeholder="Full name"
            [(ngModel)]="name"
            name="name"
            class="rounded-md"
            required aria-label="Customer Name" />
        </div>

        <div>
          <label for="customer-add-phone-number-2" class="block text-xs font-semibold text-slate-700 mb-1">
            Phone Number <span class="text-rose-500">*</span>
          </label>
          <div class="flex gap-2">
            <span class="h-9 px-3 flex items-center bg-slate-50 border border-slate-300 rounded-md text-sm text-slate-600 shrink-0">
              +880
            </span>
            <input id="customer-add-phone-number-2"
              type="text"
              nz-input
              placeholder="1XXXXXXXXX"
              [(ngModel)]="phone"
              name="phone"
              class="rounded-md flex-1"
              required aria-label="Phone Number" />
          </div>
        </div>

        <div>
          <label for="customer-add-gender-3" class="block text-xs font-semibold text-slate-700 mb-1">
            Gender <span class="text-rose-500">*</span>
          </label>
          <nz-select id="customer-add-gender-3" nzId="customer-add-gender-3" [(ngModel)]="gender" name="gender" class="w-full" aria-label="Gender">
            <nz-option nzValue="Male" nzLabel="Male"></nz-option>
            <nz-option nzValue="Female" nzLabel="Female"></nz-option>
            <nz-option nzValue="Other" nzLabel="Other"></nz-option>
          </nz-select>
        </div>

        <div>
          <label for="customer-add-customer-type-4" class="block text-xs font-semibold text-slate-700 mb-1">
            Customer Type <span class="text-rose-500">*</span>
          </label>
          <div class="flex gap-1.5">
            <nz-select id="customer-add-customer-type-4" nzId="customer-add-customer-type-4" [(ngModel)]="type" name="type" class="flex-1" aria-label="Customer Type">
              @for (t of customerTypes; track t) {
                <nz-option [nzValue]="t" [nzLabel]="t"></nz-option>
              }
            </nz-select>
            <button
              type="button"
              nz-button
              nzType="primary"
              (click)="isAddCustomerTypeOpen = true"
              nz-tooltip
              nzTooltipTitle="Quick Add Customer Type"
              class="btn-quick-add"
             aria-label="Quick Add Customer Type">
              <span nz-icon nzType="plus"></span>
            </button>
          </div>
        </div>

        <div>
          <label for="customer-add-discount-default-line-discount-5" class="block text-xs font-semibold text-slate-700 mb-1">
            Discount % <span class="text-xs text-slate-400 font-normal">(Default line discount)</span>
          </label>
          <input id="customer-add-discount-default-line-discount-5"
            type="number"
            nz-input
            placeholder="0"
            min="0"
            max="100"
            [(ngModel)]="discountPercent"
            name="discountPercent"
            class="rounded-md" aria-label="Discount % (Default line discount)" />
        </div>

        <div>
          <label for="customer-add-email-6" class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
          <input id="customer-add-email-6"
            type="email"
            nz-input
            placeholder="email@example.com"
            [(ngModel)]="email"
            name="email"
            class="rounded-md" aria-label="Email" />
        </div>

        <div class="md:col-span-2 flex items-center justify-between p-4 bg-slate-50 rounded-lg border border-slate-200">
          <div>
            <span class="text-sm font-semibold text-slate-800 block">Has Opening Due Balance?</span>
            <span class="text-xs text-slate-500">Record customer's prior unpaid ledger debt</span>
          </div>
          <label nz-checkbox [(ngModel)]="dueEnabled" name="dueEnabled"></label>
        </div>

        @if (dueEnabled) {
          <div>
            <label for="customer-add-due-amount-7" class="block text-xs font-semibold text-slate-700 mb-1">
              Due Amount (৳) <span class="text-rose-500">*</span>
            </label>
            <input id="customer-add-due-amount-7"
              type="number"
              nz-input
              placeholder="0.00"
              [(ngModel)]="dueAmount"
              name="dueAmount"
              class="rounded-md" aria-label="Due Amount (৳)" />
          </div>

          <div>
            <label for="customer-add-promised-payment-date-8" class="block text-xs font-semibold text-slate-700 mb-1">Promised Payment Date</label>
            <nz-date-picker id="customer-add-promised-payment-date-8" nzId="customer-add-promised-payment-date-8"
              [(ngModel)]="dueDate"
              name="dueDate"
              nzFormat="dd-MM-yyyy"
              class="w-full rounded-md" aria-label="Promised Payment Date"></nz-date-picker>
          </div>
        }

        <div class="md:col-span-2">
          <label for="customer-add-street-address-9" class="block text-xs font-semibold text-slate-700 mb-1">Street Address</label>
          <textarea id="customer-add-street-address-9"
            nz-input
            rows="2"
            placeholder="Street address, area, city..."
            [(ngModel)]="address"
            name="address"
            class="rounded-md" aria-label="Street Address"></textarea>
        </div>

        <div class="md:col-span-2">
          <label for="customer-add-note-10" class="block text-xs font-semibold text-slate-700 mb-1">Note</label>
          <textarea id="customer-add-note-10"
            nz-input
            rows="2"
            placeholder="Additional notes about customer preferences..."
            [(ngModel)]="note"
            name="note"
            class="rounded-md" aria-label="Note"></textarea>
        </div>

        <div class="md:col-span-2 flex items-center justify-between p-4 theme-highlight-card rounded-lg">
          <div>
            <p class="text-sm font-bold theme-highlight-title mb-0.5">Loyalty Member</p>
            <p class="text-xs theme-highlight-subtitle mb-0">Enroll in points accumulation and reward redemptions</p>
          </div>
          <label nz-checkbox [(ngModel)]="loyalty" name="loyalty"></label>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" nz-button class="btn-cancel rounded-md" (click)="goBack()">
          Cancel
        </button>
        <button type="submit" nz-button nzType="primary" class="btn-save rounded-md font-semibold">
          <span nz-icon nzType="check"></span> Save Customer
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Quick Add Customer Type Modal -->
<nz-modal
  [(nzVisible)]="isAddCustomerTypeOpen"
  nzTitle="Quick Add Customer Type"
  nzOkText="Add Type"
  [nzCentered]="true"
  [nzWidth]="480"
  (nzOnCancel)="isAddCustomerTypeOpen = false"
  (nzOnOk)="saveNewCustomerType()"
>
  <ng-container *nzModalContent>
    <div class="py-1">
      <label for="customer-add-customer-type-name-11" class="block text-xs font-semibold text-slate-700 mb-1">
        Customer Type Name <span class="text-rose-500">*</span>
      </label>
      <input id="customer-add-customer-type-name-11"
        type="text"
        nz-input
        placeholder="e.g. Clinic, Corporate, NGO"
        [(ngModel)]="newCustomerTypeName"
        class="rounded-md" aria-label="Customer Type Name" />
    </div>
  </ng-container>
</nz-modal>
