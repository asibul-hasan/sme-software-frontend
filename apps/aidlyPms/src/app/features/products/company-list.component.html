<div class="h-[calc(100vh-130px)] flex flex-col space-y-3 w-full">
  <app-page-header
    title="Pharmaceutical Companies"
    subtitle="Manage medicine manufacturers, distributors, and supplier brands"
    formId="PROD_1603"
    [breadcrumbs]="[{ label: 'Products', url: '/products/list' }, { label: 'Companies' }]"
  >
    <div filters class="flex items-center gap-2 shrink-0 flex-wrap">
      <nz-input-group [nzPrefix]="searchIcon" class="w-72 shrink-0 rounded-md">
        <input id="company-list-search-company-name-2"
          type="text"
          nz-input
          placeholder="Search company name..."
          [(ngModel)]="searchQuery" aria-label="Search company name..." />
      </nz-input-group>
      <ng-template #searchIcon>
        <span nz-icon nzType="search" class="text-slate-400"></span>
      </ng-template>

      <button nz-button nzType="default" class="rounded-md h-7 px-2.5 text-xs shrink-0" (click)="searchQuery = ''">
        <span nz-icon nzType="clear"></span> Reset
      </button>
    </div>

    <div actions class="flex items-center gap-2 shrink-0 flex-wrap">
      <button *appMenuAction="'PROD_1603:create'" nz-button nzType="primary" class="rounded-md" (click)="openAddModal()">
        <span nz-icon nzType="plus"></span> Add Company
      </button>
    </div>
  </app-page-header>

  <div class="flex-1 min-h-0 flex flex-col bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden w-full">
    <!-- Table Scroll Container -->
    <nz-spin [nzSpinning]="isLoading()" class="flex-1 min-h-0 flex flex-col w-full">
    <div class="flex-1 min-h-0 overflow-auto w-full max-w-full">
      <table class="w-full text-sm text-left border-collapse min-w-[500px]">
        <thead class="sticky top-0 z-10 bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b border-slate-200 shadow-xs">
          <tr>
            <th class="p-3 w-16 text-center">ID</th>
            <th class="p-3">Company Name</th>
            <th class="p-3 text-center w-36">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-slate-800">
          @for (c of filteredCompanies(); track c.company_no) {
            <tr class="hover:bg-slate-50/70 transition-colors">
              <td class="p-3 text-center font-mono text-xs text-slate-400">#{{ c.company_no }}</td>
              <td class="p-3 font-semibold text-slate-900">{{ c.name }}</td>
              <td class="p-3 text-center">
                <div class="inline-flex items-center gap-1.5">
                  <button
                    *appMenuAction="'PROD_1603:edit'"
                    type="button"
                    (click)="openEditModal(c)"
                    nz-tooltip
                    nzTooltipTitle="Edit Company"
                    class="btn-tbl-action btn-tbl-edit"
                   aria-label="Edit Company">
                    <span nz-icon nzType="edit"></span>
                  </button>
                  <button
                    *appMenuAction="'PROD_1603:delete'"
                    type="button"
                    (click)="deleteCompany(c)"
                    nz-tooltip
                    nzTooltipTitle="Delete Company"
                    class="btn-tbl-action btn-tbl-delete"
                   aria-label="Delete Company">
                    <span nz-icon nzType="delete"></span>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="p-6 text-center">
                <app-empty-state
                  [title]="hasError() ? 'Failed to Load Companies' : (searchQuery.trim() ? 'No Matching Companies' : 'No Pharmaceutical Companies Added')"
                  [description]="hasError() ? 'Unable to reach manufacturer database. Please check your connection and retry.' : (searchQuery.trim() ? 'No pharmaceutical manufacturers match your search query.' : 'Register medicine manufacturers (e.g. Square, Beximco, Incepta) to categorize inventory.')"
                  [stateType]="hasError() ? 'error' : (searchQuery.trim() ? 'filtered' : 'empty')"
                  icon="medicine-box"
                  [actionText]="hasError() ? 'Retry Loading' : (searchQuery.trim() ? 'Clear Search' : 'Add First Company')"
                  [actionIcon]="hasError() ? 'reload' : (searchQuery.trim() ? 'clear' : 'plus')"
                  (actionClick)="onEmptyTableAction()"
                  [compact]="true"
                  [transparent]="true"
                ></app-empty-state>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    </nz-spin>

    <!-- Sticky Bottom Footer -->
    <div class="table-sticky-footer shrink-0 bg-slate-50 border-t border-slate-200 px-4 py-2.5 flex items-center justify-between text-xs text-slate-600">
      <div class="flex items-center gap-2">
        <span>Total Pharmaceutical Manufacturers: <strong class="text-slate-900 font-semibold font-mono">{{ filteredCompanies().length }}</strong></span>
      </div>
      <span class="text-slate-400">Verified System Master Record</span>
    </div>
  </div>
</div>

<!-- Unified Dual-Purpose Modal (Add & Modify) -->
<nz-modal
  [(nzVisible)]="isModalVisible"
  [nzTitle]="modalMode === 'create' ? 'Add New Company' : ('Modify Company: ' + currentForm.name)"
  [nzOkText]="modalMode === 'create' ? 'Save Company' : 'Update Company'"
  [nzOkLoading]="isSaving()"
  (nzOnCancel)="isModalVisible = false"
  (nzOnOk)="saveCompany()"
>
  <ng-container *nzModalContent>
    <div class="space-y-3 py-1">
      <div>
        <label for="company-list-company-name-1" class="block text-xs font-semibold text-slate-700 mb-1">
          Company Name <span class="text-rose-500">*</span>
        </label>
        <input id="company-list-company-name-1"
          type="text"
          nz-input
          placeholder="e.g. Beximco Pharmaceuticals Ltd."
          [(ngModel)]="currentForm.name"
          class="rounded-md"
          (keyup.enter)="saveCompany()" aria-label="Company Name" />
      </div>
    </div>
  </ng-container>
</nz-modal>
