<div class="w-full space-y-4">
  <app-page-header
    title="Add Representative"
    subtitle="Register new pharmacy staff, store manager, or POS operator account"
    formId="REP_1802"
    [breadcrumbs]="[{ label: 'Representatives', url: '/representative' }, { label: 'Add Staff' }]"
  >
    <div actions class="flex items-center gap-2">
      <button nz-button nzType="default" (click)="goBack()" class="rounded-md">
        <span nz-icon nzType="arrow-left"></span> Back
      </button>
    </div>
  </app-page-header>

  <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-6">
    <form (ngSubmit)="submitForm()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            First Name <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            nz-input
            placeholder="First name"
            [(ngModel)]="firstName"
            name="firstName"
            class="rounded-md"
            required
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            Last Name <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            nz-input
            placeholder="Last name"
            [(ngModel)]="lastName"
            name="lastName"
            class="rounded-md"
            required
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            Phone Number <span class="text-rose-500">*</span>
          </label>
          <div class="flex gap-2">
            <span class="h-9 px-3 flex items-center bg-slate-50 border border-slate-300 rounded-md text-sm text-slate-600 shrink-0">
              +880
            </span>
            <input
              type="text"
              nz-input
              placeholder="1XXXXXXXXX"
              [(ngModel)]="phone"
              name="phone"
              class="rounded-md flex-1"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Gender</label>
          <nz-select [(ngModel)]="gender" name="gender" class="w-full">
            <nz-option nzValue="Male" nzLabel="Male"></nz-option>
            <nz-option nzValue="Female" nzLabel="Female"></nz-option>
            <nz-option nzValue="Other" nzLabel="Other"></nz-option>
          </nz-select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
          <input
            type="email"
            nz-input
            placeholder="name@pharmacy.com"
            [(ngModel)]="email"
            name="email"
            class="rounded-md"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            Role <span class="text-rose-500">*</span>
          </label>
          <div class="flex gap-1.5">
            <nz-select [(ngModel)]="roleNo" name="roleNo" class="flex-1" nzPlaceHolder="Select Role">
              @for (r of roles(); track r.role_no) {
                <nz-option [nzValue]="r.role_no" [nzLabel]="r.alias"></nz-option>
              }
            </nz-select>
            <button
              type="button"
              (click)="openAddRoleModal()"
              nz-tooltip
              nzTooltipTitle="Quick Add Role"
              class="btn-quick-add"
            >
              <span nz-icon nzType="plus"></span>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            Password <span class="text-rose-500">*</span>
          </label>
          <input
            type="password"
            nz-input
            placeholder="••••••"
            [(ngModel)]="password"
            name="password"
            class="rounded-md"
            required
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            Confirm Password <span class="text-rose-500">*</span>
          </label>
          <input
            type="password"
            nz-input
            placeholder="••••••"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            class="rounded-md"
            required
          />
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
        <button type="button" nz-button nzType="default" (click)="goBack()" class="rounded-md">
          Cancel
        </button>
        <button type="submit" nz-button nzType="primary" class="rounded-md">
          <span nz-icon nzType="check"></span> Create Representative
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Quick Add Role Modal -->
<nz-modal
  [(nzVisible)]="isAddRoleModalOpen"
  nzTitle="Quick Add Role"
  nzOkText="Add Role"
  [nzCentered]="true"
  [nzWidth]="480"
  (nzOnCancel)="isAddRoleModalOpen = false"
  (nzOnOk)="saveNewRole()"
>
  <ng-container *nzModalContent>
    <div class="py-1">
      <label class="block text-xs font-semibold text-slate-700 mb-1">
        Role Title <span class="text-rose-500">*</span>
      </label>
      <input
        type="text"
        nz-input
        placeholder="e.g. Lead Pharmacist, Billing Associate"
        [(ngModel)]="newRoleName"
        class="rounded-md"
      />
    </div>
  </ng-container>
</nz-modal>
